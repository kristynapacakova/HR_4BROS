<title>Onboarding — Four Bros</title>

<style>
/* ============================================================
   FOUR BROS — ONBOARDING
   Barvy a písma podle Four Bros Brand Guidelines v1.0.
   ============================================================ */

:root{
  /* Značkové barvy (brandbook 4.2) */
  --navy:#194669;
  --alice:#F7F8FE;
  --lightgrey:#F4F4F4;
  --violet:#7E17E0;
  --navy-solid:#194669;

  /* Plochy a text */
  --bg:#FFFFFF;
  --surface:#F7F8FE;
  --surface-2:#F4F4F4;
  --card:#FFFFFF;
  --ink:#2A3F52;
  --ink-strong:#194669;
  --ink-muted:#6B8299;
  --ink-light:#93A8BB;
  --line:#E4EBF3;
  --line-soft:#EFF4F9;

  --accent:#7E17E0;
  --accent-hover:#6D12C4;
  --accent-soft:#F4EAFE;
  --accent-ink:#7E17E0;
  --on-accent:#FFFFFF;

  --shadow-sm:0 1px 2px rgba(25,70,105,.05);
  --shadow:0 1px 3px rgba(25,70,105,.06),0 8px 20px -6px rgba(25,70,105,.09);
  --shadow-lg:0 2px 6px rgba(25,70,105,.07),0 16px 40px -12px rgba(25,70,105,.14);

  /* Postranní panel v primární barvě — Navy je podle manuálu hlavní barva
     a nespadá do 5% limitu vyhrazeného pro Electric Violet. */
  --rail:#194669;
  --rail-ink:#EAF1F7;
  --rail-ink-dim:#9FBBD1;
  --rail-hover:rgba(255,255,255,.08);
  --rail-active:rgba(255,255,255,.14);
  --rail-line:rgba(255,255,255,.14);

  /* Písma (brandbook 5.1–5.4) */
  --display:'Serenity','Serenity Light','Futura','Avenir Next','Century Gothic','Questrial','Trebuchet MS',sans-serif;
  --body:'Roboto','Roboto Light','Helvetica Neue','Segoe UI',Arial,sans-serif;

  --t-xs:.8125rem;
  --t-sm:.875rem;
  --t-base:1rem;
  --t-md:1.0625rem;
  --t-lg:1.1875rem;
  --t-xl:1.375rem;
  --t-2xl:clamp(1.6rem,2.8vw,2.05rem);
  --t-3xl:clamp(2.15rem,4.8vw,3.5rem);

  --r-sm:8px;
  --r:12px;
  --r-lg:16px;
  --r-full:999px;

  --measure:66ch;
  --side:262px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1F2E;
    --surface:#17293B;
    --surface-2:#142334;
    --card:#17293B;
    --ink:#D7E3ED;
    --ink-strong:#FFFFFF;
    --ink-muted:#93A8BB;
    --ink-light:#6F8699;
    --line:#25405A;
    --line-soft:#1E3549;
    --accent:#B472FF;
    --accent-hover:#C48EFF;
    --accent-soft:#2B1A48;
    --accent-ink:#C795FF;
    --on-accent:#190B32;
    --navy:#A8C6DE;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.4);
    --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 16px 40px -12px rgba(0,0,0,.5);
    --rail:#0A1826;
    --rail-ink:#D7E3ED;
    --rail-ink-dim:#8CA4B8;
    --rail-hover:rgba(255,255,255,.06);
    --rail-active:rgba(255,255,255,.1);
    --rail-line:rgba(255,255,255,.1);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1F2E;
  --surface:#17293B;
  --surface-2:#142334;
  --card:#17293B;
  --ink:#D7E3ED;
  --ink-strong:#FFFFFF;
  --ink-muted:#93A8BB;
  --ink-light:#6F8699;
  --line:#25405A;
  --line-soft:#1E3549;
  --accent:#B472FF;
  --accent-hover:#C48EFF;
  --accent-soft:#2B1A48;
  --accent-ink:#C795FF;
  --on-accent:#190B32;
  --navy:#A8C6DE;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.4);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 16px 40px -12px rgba(0,0,0,.5);
  --rail:#0A1826;
  --rail-ink:#D7E3ED;
  --rail-ink-dim:#8CA4B8;
  --rail-hover:rgba(255,255,255,.06);
  --rail-active:rgba(255,255,255,.1);
  --rail-line:rgba(255,255,255,.1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-weight:300;
  font-size:var(--t-base);
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}

h1,h2{
  font-family:var(--display);font-weight:300;color:var(--ink-strong);
  margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance;
}
h1{font-size:var(--t-3xl);}
h2{font-size:var(--t-2xl);}
h3{font-family:var(--body);font-weight:700;font-size:var(--t-lg);color:var(--ink-strong);
   margin:0;line-height:1.35;text-wrap:balance;letter-spacing:-.008em;}
h4{font-family:var(--body);font-weight:700;font-size:var(--t-base);color:var(--ink-strong);margin:0;line-height:1.45;}
p{margin:0;max-width:var(--measure);text-wrap:pretty;}
strong{font-weight:700;color:var(--ink-strong);}
a{color:var(--accent-ink);text-underline-offset:3px;}
ul,ol{margin:0;padding-left:1.2rem;display:grid;gap:.45rem;max-width:var(--measure);align-content:start;}
li::marker{color:var(--ink-light);}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.label{
  font-size:var(--t-sm);font-weight:500;color:var(--ink-muted);margin:0;
  letter-spacing:0;
}
.lede{font-size:var(--t-md);line-height:1.6;color:var(--ink-muted);max-width:58ch;font-weight:300;}

/* ============================================================
   KOSTRA
   ============================================================ */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);}
@media (min-width:980px){.app{grid-template-columns:var(--side) minmax(0,1fr);}}

.side{
  min-width:0;background:var(--rail);color:var(--rail-ink);
  position:sticky;top:0;z-index:40;
  display:flex;flex-direction:column;gap:.85rem;
  padding:.85rem 1rem;
}
@media (min-width:980px){
  .side{height:100vh;padding:1.6rem 1rem;gap:1.5rem;}
}
/* Ikony v panelu leží na tmavé ploše, musí mít vlastní barvy. */
.side .ic .stroke{stroke:var(--rail-ink-dim);}
.side .ic .detail{stroke:#C99BFF;}
.side .ic .detail-fill{fill:#C99BFF;}

.logo{display:flex;align-items:center;gap:.6rem;min-width:0;padding:0 .4rem;}
.logo svg{width:30px;height:30px;flex:none;}
.logo b{
  font-family:var(--display);font-size:1.3rem;font-weight:400;color:#FFFFFF;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em;
}

.toggle{
  display:flex;gap:.2rem;background:rgba(0,0,0,.22);
  border-radius:var(--r-full);padding:.22rem;min-width:0;
}
.toggle button{
  flex:1;font-family:var(--body);font-size:var(--t-sm);font-weight:500;
  background:transparent;border:0;border-radius:var(--r-full);
  padding:.42rem .5rem;color:var(--rail-ink-dim);cursor:pointer;white-space:nowrap;
  transition:background .16s ease,color .16s ease;
}
.toggle button:hover{color:#FFFFFF;}
.toggle button[aria-pressed="true"]{background:#FFFFFF;color:var(--navy-solid);}

.menu{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;min-width:0;}
.menu::-webkit-scrollbar{display:none;}
@media (min-width:980px){
  .menu{flex-direction:column;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
}
.menu a{
  display:flex;align-items:center;gap:.7rem;
  padding:.6rem .75rem;border-radius:var(--r-sm);
  color:var(--rail-ink);text-decoration:none;font-size:var(--t-base);
  white-space:nowrap;line-height:1.3;
  transition:background .16s ease,color .16s ease;
}
.menu a:hover{background:var(--rail-hover);}
.menu a[aria-current="page"]{background:var(--rail-active);color:#FFFFFF;font-weight:500;}
.menu a[aria-current="page"] .ic .stroke{stroke:#FFFFFF;}
.menu a svg{width:19px;height:19px;flex:none;}
.menu a .n{
  margin-left:auto;font-size:var(--t-xs);color:var(--rail-ink-dim);
  font-variant-numeric:tabular-nums;
}
@media (max-width:979px){.menu a .n{display:none;}}

.side-foot{display:none;}
@media (min-width:980px){
  .side-foot{display:grid;gap:.5rem;padding:.9rem .4rem 0;border-top:1px solid var(--rail-line);}
}
.side-progress{display:grid;gap:.4rem;}
.side-progress .row{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--rail-ink-dim);}
.side-progress .row b{color:#FFFFFF;font-weight:500;font-variant-numeric:tabular-nums;}
.bar{height:5px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden;}
.side .bar{background:rgba(255,255,255,.16);}
.side .bar > i{background:#C99BFF;}
.bar > i{display:block;height:100%;border-radius:var(--r-full);background:var(--accent);
  width:0;transition:width .5s cubic-bezier(.22,.61,.36,1);}

.main{min-width:0;padding:clamp(1.5rem,3.5vw,3rem) clamp(1.15rem,3.5vw,3rem) 6rem;}
.view{max-width:800px;display:grid;gap:clamp(1.75rem,3vw,2.5rem);min-width:0;}
.group{display:grid;gap:1rem;min-width:0;align-content:start;}
.head{display:grid;gap:.6rem;min-width:0;align-content:start;}

/* ============================================================
   PRVKY
   ============================================================ */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:clamp(1.15rem,2.4vw,1.5rem);display:grid;gap:.85rem;min-width:0;
  align-content:start;
}
.card.soft{background:var(--surface);border-color:transparent;}
.card.raised{box-shadow:var(--shadow);border-color:var(--line-soft);}
.card.hero-card{padding:clamp(1.5rem,3.4vw,2.5rem);gap:1.6rem;}

.duo{display:grid;gap:1rem;min-width:0;}
@media (min-width:640px){.duo{grid-template-columns:1fr 1fr;}}

.ic .stroke{fill:none;stroke:var(--navy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.ic .detail{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.ic .detail-fill{fill:var(--accent);stroke:none;}
.badge{
  width:42px;height:42px;border-radius:var(--r-full);background:var(--alice);
  display:grid;place-items:center;flex:none;
}
:root[data-theme="dark"] .badge,:root:not([data-theme="light"]) .badge{background:var(--surface-2);}
.badge svg{width:21px;height:21px;}

.pill{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:var(--t-xs);font-weight:500;color:var(--ink-muted);
  background:var(--surface-2);border-radius:var(--r-full);
  padding:.14rem .55rem;white-space:nowrap;
}
.pill.now{background:var(--accent-soft);color:var(--accent-ink);}
.pill.now::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink);}
.pill.only{background:transparent;border:1px solid var(--line);color:var(--ink-muted);}

.mode{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface);border-radius:var(--r);padding:.75rem 1rem;
  font-size:var(--t-sm);color:var(--ink-muted);
}
.mode > span:last-child{flex:1;min-width:12rem;}

.btn{
  font-family:var(--body);font-size:var(--t-sm);font-weight:500;
  color:var(--on-accent);background:var(--accent);
  border:1px solid var(--accent);border-radius:var(--r-sm);
  padding:.6rem 1.1rem;cursor:pointer;
  transition:background .16s ease,border-color .16s ease,transform .1s ease;
}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:var(--card);color:var(--ink-strong);border-color:var(--line);}
.btn.ghost:hover{background:var(--surface);border-color:var(--ink-light);}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;}

/* ---------- Brushová plocha (brandbook 7.1) ---------- */
.washed{position:relative;overflow:hidden;}
.wash{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(58% 78% at 88% 6%, rgba(25,70,105,.13), transparent 68%),
    radial-gradient(42% 58% at 66% 96%, rgba(126,23,224,.07), transparent 70%),
    radial-gradient(46% 66% at 104% 56%, rgba(25,70,105,.09), transparent 72%),
    radial-gradient(38% 52% at 30% -10%, rgba(25,70,105,.05), transparent 70%);
}
:root[data-theme="dark"] .wash,
:root:not([data-theme="light"]) .wash{
  background-image:
    radial-gradient(58% 78% at 88% 6%, rgba(120,175,220,.16), transparent 68%),
    radial-gradient(42% 58% at 66% 96%, rgba(180,114,255,.12), transparent 70%),
    radial-gradient(46% 66% at 104% 56%, rgba(120,175,220,.10), transparent 72%);
}
.washed > *:not(.wash){position:relative;z-index:1;}

/* ---------- Přehled ---------- */
.hero{
  display:grid;gap:1.5rem;align-items:center;grid-template-columns:minmax(0,1fr);
}
@media (min-width:620px){.hero{grid-template-columns:minmax(0,1fr) auto;gap:2rem;}}

.ring{position:relative;width:148px;height:148px;justify-self:center;flex:none;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .track{fill:none;stroke:var(--line);stroke-width:10;}
.ring .fill{
  fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.22,.61,.36,1);
}
.ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:.05rem;}
.ring-num b{
  font-family:var(--display);font-size:2.4rem;font-weight:300;color:var(--ink-strong);
  line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.ring-num span{font-size:var(--t-xs);color:var(--ink-muted);}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));}}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.85rem .95rem;display:grid;gap:.1rem;min-width:0;
}
.stat dt{font-size:var(--t-xs);color:var(--ink-muted);}
.stat dd{
  margin:0;font-size:var(--t-lg);font-weight:500;color:var(--ink-strong);
  font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere;
}
.stat dd.text{font-size:var(--t-base);font-weight:400;}

/* ---------- Fáze ---------- */
.phases{display:grid;gap:.75rem;list-style:none;margin:0;padding:0;max-width:none;}
.phase{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;min-width:0;transition:border-color .18s ease,box-shadow .18s ease;
}
.phase[open]{box-shadow:var(--shadow);}
.phase.current{border-color:var(--accent);}
.phase summary{
  display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;
  padding:1rem 1.15rem;cursor:pointer;list-style:none;min-width:0;
  transition:background .16s ease;
}
.phase summary:hover{background:var(--surface);}
.phase summary::-webkit-details-marker{display:none;}
.phase summary h3{flex:1;min-width:0;}
.phase .when{font-size:var(--t-sm);color:var(--ink-muted);display:block;font-weight:300;}
.phase .count{font-size:var(--t-sm);color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.chev{
  width:18px;height:18px;flex:none;color:var(--ink-light);
  transition:transform .22s ease;
}
.phase[open] .chev{transform:rotate(180deg);}
.phase-body{padding:0 1.15rem 1.15rem;display:grid;gap:1rem;min-width:0;}
.phase-body > p{color:var(--ink-muted);}

.tasks{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:none;
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;}
.tasks > li{border-bottom:1px solid var(--line-soft);min-width:0;}
.tasks > li:last-child{border-bottom:0;}
.task{display:grid;gap:.3rem;padding:.75rem .95rem;min-width:0;align-content:start;transition:background .14s ease;}
.task:hover{background:var(--surface);}
.task-main{display:flex;gap:.8rem;align-items:flex-start;cursor:pointer;min-width:0;}
.task .text{display:block;flex:1;min-width:0;line-height:1.5;overflow-wrap:anywhere;}
.task input:checked ~ .text{color:var(--ink-light);}
.task input:checked ~ .text strong,
.task input:checked ~ .text .val{color:var(--ink-light);font-weight:400;}
.task-sub{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding-left:calc(19px + .8rem);}
.helper{
  font-size:var(--t-xs);font-weight:500;color:var(--accent-ink);background:var(--accent-soft);
  border:0;border-radius:var(--r-full);padding:.14rem .6rem;cursor:pointer;
  font-family:var(--body);white-space:nowrap;transition:background .16s ease;
}
.helper:hover{background:var(--accent);color:var(--on-accent);}

input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:19px;height:19px;margin:.2rem 0 0;flex:none;
  border:1.5px solid var(--ink-light);border-radius:5px;background:var(--card);
  cursor:pointer;display:grid;place-content:center;
  transition:background .16s ease,border-color .16s ease;
}
input[type="checkbox"]:hover{border-color:var(--accent);}
input[type="checkbox"]::after{
  content:"";width:9px;height:5px;
  border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);
  transform:rotate(-45deg) scale(0);
  transition:transform .18s cubic-bezier(.3,1.5,.5,1);
}
input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent);}
input[type="checkbox"]:checked::after{transform:rotate(-45deg) scale(1);}

/* ---------- Pravidla ---------- */
.rules{display:grid;gap:.6rem;min-width:0;max-width:none;}
.rule{
  display:flex;gap:.9rem;align-items:flex-start;min-width:0;
  background:var(--surface);border-radius:var(--r);padding:1rem 1.15rem;
}
.rule-n{
  width:26px;height:26px;border-radius:var(--r-full);flex:none;
  background:var(--navy-solid);color:#FFFFFF;display:grid;place-items:center;
  font-size:var(--t-xs);font-weight:500;
}
.rule h3{font-size:var(--t-base);margin-bottom:.15rem;}
.rule p{font-size:var(--t-sm);color:var(--ink-muted);max-width:none;}

/* ---------- Zádrhele ---------- */
.faq{display:grid;gap:.5rem;min-width:0;max-width:none;padding-left:0;list-style:none;}
.qa{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;min-width:0;
}
.qa[open]{border-color:var(--accent);}
.qa summary{
  display:flex;align-items:center;gap:1rem;padding:.9rem 1.15rem;
  cursor:pointer;list-style:none;font-weight:500;color:var(--ink-strong);
  transition:background .16s ease;
}
.qa summary::-webkit-details-marker{display:none;}
.qa summary:hover{background:var(--surface);}
.qa summary > span{flex:1;min-width:0;}
.qa-body{
  padding:0 1.15rem 1.15rem 2.6rem;display:grid;gap:.55rem;
  max-width:none;color:var(--ink);
}
.qa-body li::marker{color:var(--accent-ink);font-weight:500;}

/* ---------- Posádka ---------- */
.crew{display:grid;gap:.6rem;min-width:0;max-width:none;}
@media (min-width:700px){.crew{grid-template-columns:1fr 1fr;}}
.mate{
  display:flex;gap:.9rem;align-items:flex-start;min-width:0;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:.95rem 1.05rem;transition:border-color .16s ease;
}
.mate:hover{border-color:var(--ink-light);}
.mate-mark{
  width:38px;height:38px;border-radius:var(--r-full);flex:none;
  background:var(--navy-solid);color:#FFFFFF;
  display:grid;place-items:center;font-size:var(--t-sm);font-weight:500;
  letter-spacing:.02em;
}
.mate h4{margin:0 0 .1rem;}
.mate-role{font-weight:300;color:var(--ink-muted);font-size:var(--t-sm);}
.mate p{font-size:var(--t-sm);color:var(--ink-muted);line-height:1.5;max-width:none;}

/* ---------- Návody ---------- */
.tiles{display:grid;gap:.75rem;min-width:0;max-width:none;}
@media (min-width:640px){.tiles{grid-template-columns:1fr 1fr;}}
.tile{
  text-align:left;font-family:var(--body);font-size:var(--t-base);color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:1.15rem;cursor:pointer;display:grid;gap:.55rem;min-width:0;
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.tile:hover{border-color:transparent;box-shadow:var(--shadow);transform:translateY(-2px);}
.tile .top{display:flex;align-items:center;gap:.75rem;min-width:0;}
.tile h3{font-size:var(--t-base);flex:1;min-width:0;}
.tile p{font-size:var(--t-sm);color:var(--ink-muted);max-width:none;line-height:1.5;}
.tile .n{font-size:var(--t-xs);color:var(--ink-light);font-variant-numeric:tabular-nums;flex:none;}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:s;max-width:none;}
.steps > li{
  display:flex;gap:.9rem;align-items:flex-start;min-width:0;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.85rem 1rem;transition:border-color .16s ease;
}
.steps > li:hover{border-color:var(--ink-light);}
.steps > li::before{
  counter-increment:s;content:counter(s);
  width:24px;height:24px;border-radius:var(--r-full);flex:none;
  background:var(--surface-2);color:var(--ink-muted);
  font-size:var(--t-xs);font-weight:500;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.steps label{display:flex;gap:.8rem;align-items:flex-start;cursor:pointer;flex:1;min-width:0;}
.steps .text{display:block;flex:1;min-width:0;line-height:1.55;overflow-wrap:anywhere;}
.steps input:checked ~ .text{color:var(--ink-light);}
.steps input:checked ~ .text strong,
.steps input:checked ~ .text .val{color:var(--ink-light);font-weight:400;}

.progress{display:grid;gap:.5rem;min-width:0;}
.progress .row{display:flex;justify-content:space-between;gap:1rem;font-size:var(--t-sm);color:var(--ink-muted);}
.progress .row b{color:var(--ink-strong);font-weight:500;font-variant-numeric:tabular-nums;}

/* ---------- Doplňovaná místa ---------- */
.gap{
  background:var(--accent-soft);color:var(--accent-ink);
  border-radius:4px;padding:.05rem .3rem;white-space:nowrap;font-weight:400;
}
.val{font-weight:500;color:var(--ink-strong);}

/* ---------- Tabulky ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);min-width:0;}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm);min-width:460px;}
th,td{text-align:left;padding:.7rem .95rem;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55;}
th{font-weight:500;color:var(--ink-muted);font-size:var(--t-xs);white-space:nowrap;
   background:var(--surface);border-bottom-color:var(--line);}
tr:last-child td{border-bottom:0;}
td.nw{white-space:nowrap;color:var(--ink-muted);font-variant-numeric:tabular-nums;}

/* ---------- Poznámka ---------- */
.note{
  background:var(--accent-soft);border-radius:var(--r);
  padding:1rem 1.2rem;display:grid;gap:.4rem;min-width:0;
}
.note .label{color:var(--accent-ink);font-weight:700;}
.note p{color:var(--ink);}

/* ---------- Vzorky ---------- */
.swatches{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));min-width:0;max-width:none;}
.swatch{border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);}
.swatch .chip{height:58px;}
.swatch .meta{padding:.55rem .7rem;display:grid;gap:.05rem;background:var(--card);}
.swatch .meta b{font-size:var(--t-sm);color:var(--ink-strong);font-weight:500;}
.swatch .meta span{font-size:var(--t-xs);color:var(--ink-muted);font-variant-numeric:tabular-nums;}

/* ---------- Šablony ---------- */
.tpl{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;min-width:0;}
.tpl-head{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem .7rem .7rem 1.15rem;border-bottom:1px solid var(--line);background:var(--surface);
}
.tpl-body{
  padding:1.15rem;white-space:pre-wrap;font-size:var(--t-sm);
  line-height:1.7;overflow-x:auto;color:var(--ink);

.form{display:grid;gap:1rem;min-width:0;}

.field{display:grid;gap:.35rem;min-width:0;}
.field label{font-size:var(--t-sm);font-weight:500;color:var(--ink-strong);}
.field input{
  font-family:var(--body);font-size:var(--t-base);font-weight:300;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.6rem .75rem;width:100%;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.field select{
  font-family:var(--body);font-size:var(--t-base);font-weight:300;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.6rem .75rem;width:100%;cursor:pointer;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field input::placeholder{color:var(--ink-light);}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
fieldset{border:0;padding:0;margin:0;display:grid;gap:1rem;min-width:0;}
legend{font-size:var(--t-sm);font-weight:700;color:var(--ink-strong);padding:0;margin-bottom:.15rem;}

/* ---------- Hlášení ---------- */
.toast{
  position:fixed;left:50%;bottom:1.75rem;transform:translateX(-50%) translateY(160%);
  background:var(--ink-strong);color:var(--bg);
  padding:.7rem 1.2rem;border-radius:var(--r-sm);font-size:var(--t-sm);
  box-shadow:var(--shadow-lg);z-index:90;
  transition:transform .32s cubic-bezier(.22,.61,.36,1);max-width:90vw;text-align:center;
}
.toast.up{transform:translateX(-50%) translateY(0);}

.back{
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--body);
  font-size:var(--t-sm);font-weight:500;color:var(--ink-muted);justify-self:start;
}
.back:hover{color:var(--accent-ink);}

@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.view > *:nth-child(3){animation-delay:.08s;}
.view > *:nth-child(n+4){animation-delay:.11s;}

@media (prefers-reduced-motion: reduce){

}

var STORE_KEY = 'fourbros-onboarding-app-v1';
var state = { role:'novacek', config:{}, profile:{}, done:{} };

SETTINGS.forEach(function(g){
  g.items.forEach(function(f){ if(f.def){ state.config[f.key] = f.def; } });
});

function merge(target, src){
  Object.keys(src).forEach(function(k){
    if(src[k] !== '' && src[k] != null){ target[k] = src[k]; }
  });
}

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw){ return; }
    var saved = JSON.parse(raw);
    if(!saved || typeof saved !== 'object'){ return; }
    if(saved.role){ state.role = saved.role; }
    if(saved.config){ merge(state.config, saved.config); }
    if(saved.profile){ merge(state.profile, saved.profile); }
    if(saved.done){ state.done = saved.done; }
  }catch(e){ /* úložiště nedostupné */ }
}

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* soukromý režim */ }
}

function b64enc(str){
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(s){
  var b = s.replace(/-/g,'+').replace(/_/g,'/');
  while(b.length % 4){ b += '='; }
  return new TextDecoder().decode(Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); }));
}

function readShared(){
  var m = location.hash.match(/[?&]s=([^&]+)/);
  if(!m){ return; }
  try{
    var data = JSON.parse(b64dec(m[1]));
    if(data.config){ merge(state.config, data.config); }
    if(data.profile){ merge(state.profile, data.profile); }
    save();
  }catch(e){ /* poškozený odkaz */ }
}

function shareLink(){
  return location.origin + location.pathname + '#/uvod?s=' +
    b64enc(JSON.stringify({ config:state.config, profile:state.profile }));
}

   7. POMOCNÍCI
   ============================================================ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var LABELS = {};
SETTINGS.forEach(function(g){ g.items.forEach(function(f){ LABELS[f.key] = f.ph || f.label; }); });
PROFILE.forEach(function(f){ LABELS[f.key] = f.ph || f.label; });
function labelFor(key){ return LABELS[key] || key; }

function valueOf(key){
  var v = state.profile[key];
  if(v == null || v === ''){ v = state.config[key]; }
  if(key === 'nastup' && v){ v = formatDate(v); }
  return (v == null || v === '') ? null : v;
}

function fillIn(text){
  return String(text).replace(/\{\{(\w+)\}\}/g, function(_, key){
    var v = valueOf(key);
    return v ? '<span class="val">' + esc(v) + '</span>'
             : '<span class="gap">' + esc(labelFor(key)) + '</span>';
  });
}

function fillInPlain(text){
  return String(text).replace(/\{\{(\w+)\}\}/g, function(_, key){
    var v = valueOf(key);
    return v ? v : '[' + labelFor(key).toUpperCase() + ']';
  });
}

function formatDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())){ return iso; }
  return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
}

function dayOffset(){
  if(!state.profile.nastup){ return null; }
  var start = new Date(state.profile.nastup);
  if(isNaN(start.getTime())){ return null; }
  start.setHours(0,0,0,0);
  var now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - start) / 86400000);
}

function dayText(){
  var d = dayOffset();
  if(d === null){ return '—'; }
  if(d < 0){ return 'za ' + Math.abs(d) + ' dní'; }
  if(d === 0){ return 'dnes'; }
  return d + '. den';
}

function currentPhase(){
  var d = dayOffset();
  if(d === null){ return null; }
  for(var i = 0; i < PHASES.length; i++){
    if(d >= PHASES[i].from && d <= PHASES[i].to){ return PHASES[i]; }
  }
  return d < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length - 1];
}

function phaseStats(p){
  var list = tasksOf(p);
  var done = 0;
  list.forEach(function(t){ if(state.done['t:' + t.id]){ done++; } });
  return { total:list.length, done:done };
}

function taskStats(){
  var total = 0, done = 0;
  PHASES.forEach(function(p){
    var s = phaseStats(p);
    total += s.total;
    done += s.done;
  });
  return { total:total, done:done };
}

function guideStats(g){
  var done = 0;
  g.steps.forEach(function(_, i){ if(state.done['g:' + g.id + ':' + i]){ done++; } });
  return { total:g.steps.length, done:done };
}

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('up');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('up'); }, 2400);
}

      'stroke-dasharray="' + RING_C.toFixed(1) + '" ' +
      'stroke-dashoffset="' + (RING_C * (1 - pct / 100)).toFixed(1) + '"/>' +
  '</svg>';
}

    h += '<li><details class="phase' + (isNow ? ' current' : '') + '" data-phase="' + esc(p.id) + '"' +

/* Značka u člena posádky. Dvojice („Jessica a Matúš") dá JM, jedno jméno dvě
   písmena — samotné „V" by na kolečku působilo prázdně. */
function initials(name){
  var parts = String(name).split(/\s+a\s+|\s+/).filter(function(x){ return x && x.length > 1; });
  if(parts.length === 1){
    return parts[0].charAt(0).toUpperCase() + parts[0].charAt(1).toLowerCase();
  }
  return parts.slice(0, 2).map(function(x){ return x.charAt(0).toUpperCase(); }).join('');
}

  h +=   '<p>Odkaz v sobě nese všechno, co jsi vyplnila. Kdo ho otevře, uvidí rovnou konkrétní jména a systémy — a svůj vlastní postup si odškrtává u sebe.</p>';
  h +=   '<div class="btns">';
  h +=     '<button class="btn" data-sharelink>Zkopírovat sdílecí odkaz</button>';
  h +=     '<button class="btn ghost" data-reset>Vymazat odškrtnuté kroky</button>';
  h +=   '</div>';
  h += '</div>';

  h += '<div class="note"><p class="label">Kde se data ukládají</p><p>Všechno zůstává jen v tomhle prohlížeči — nikam se neodesílá. Když aplikaci otevřeš na jiném počítači, začínáš s prázdným postupem. Odškrtnuté kroky se sdílecím odkazem <strong>nepřenášejí</strong>, jen vyplněné údaje.</p></div>';

  return h;
}

function fieldHtml(f, value, scope){
  var control;
  if(f.options){
    control = '<select id="f-' + esc(f.key) + '" data-scope="' + scope + '" data-key="' + esc(f.key) + '">' +
      '<option value="">— nevybráno —</option>' +
      f.options.map(function(o){
        return '<option value="' + esc(o[0]) + '"' + (value === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select>';
  } else {
    control = '<input id="f-' + esc(f.key) + '" type="' + (f.type || 'text') + '" value="' + esc(value) + '" ' +
      'placeholder="' + esc(f.ph || '') + '" data-scope="' + scope + '" data-key="' + esc(f.key) + '">';
  }
  return '<div class="field"><label for="f-' + esc(f.key) + '">' + esc(f.label) + '</label>' + control + '</div>';
}

/* Krok se zobrazí, pokud není vázaný na typ spolupráce, nebo pokud typ sedí.
   Dokud není typ vybraný, ukazujeme všechno a odlišíme to odznakem. */
function appliesTo(item){
  if(!item.only){ return true; }
  var u = state.profile.uvazek;
  if(!u){ return true; }
  return item.only === u;
}

var UVAZEK_LABEL = { zamestnanec:'Zaměstnanec', osvc:'OSVČ' };

function onlyBadge(item){
  if(!item.only || state.profile.uvazek){ return ''; }
  return '<span class="pill only">Jen ' + esc(UVAZEK_LABEL[item.only] || item.only) + '</span>';
}

function tasksOf(p){ return p.tasks.filter(appliesTo); }

/* ============================================================
   9. ROUTER
   ============================================================ */
function parseHash(){
  var raw = location.hash.replace(/^#\/?/, '').split('?')[0];
  var parts = raw.split('/').filter(Boolean);
  return { route: parts[0] || 'uvod', id: parts[1] || null };
}

function routeFor(id){
  return ROUTES.filter(function(r){ return r.id === id; })[0] || ROUTES[0];
}

function renderChrome(){
  var cur = parseHash().route;

  document.getElementById('toggle').innerHTML =
    '<button data-role="novacek" aria-pressed="' + (state.role === 'novacek') + '">Nový kolega</button>' +
    '<button data-role="hr" aria-pressed="' + (state.role === 'hr') + '">HR</button>';

  var h = '';
  ROUTES.forEach(function(r){
    if(r.hrOnly && state.role !== 'hr'){ return; }
    var n = '';
    if(r.id === 'plan'){
      var s = taskStats();
      n = '<span class="n">' + s.done + '/' + s.total + '</span>';
    }
    if(r.id === 'navody'){ n = '<span class="n">' + GUIDES.length + '</span>'; }
    h += '<a href="#/' + r.id + '"' + (r.id === cur ? ' aria-current="page"' : '') + '>' +
         svg(r.icon) + '<span>' + esc(r.label) + '</span>' + n + '</a>';
  });
  document.getElementById('menu').innerHTML = h;

  document.getElementById('logoName').textContent = state.config.firma || 'Four Bros';

  var s2 = taskStats();
  document.getElementById('sideNum').textContent = s2.done + ' / ' + s2.total;
  document.getElementById('sideBar').style.width =
    (s2.total ? Math.round(s2.done / s2.total * 100) : 0) + '%';
}

function render(){
  var p = parseHash();
  var r = routeFor(p.route);
  if(r.hrOnly && state.role !== 'hr'){ r = ROUTES[0]; }

  document.getElementById('main').innerHTML =
    '<div class="view">' + r.render({ id:p.id }) + '</div>';

  renderChrome();
  window.scrollTo(0, 0);
}

/* ============================================================
   10. UDÁLOSTI
   ============================================================ */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest){ return; }

  var roleBtn = t.closest('[data-role]');
  if(roleBtn){
    state.role = roleBtn.getAttribute('data-role');
    save();
    render();
    return;
  }

  var guideBtn = t.closest('[data-goguide]');
  if(guideBtn){
    /* Uvnitř rozbalovací fáze by kliknutí jinak zavřelo celou sekci. */
    e.preventDefault();
    var gid = guideBtn.getAttribute('data-goguide');
    location.hash = gid ? '#/navody/' + gid : '#/navody';
    return;
  }

  var toolBtn = t.closest('[data-gotool]');
  if(toolBtn){
    e.preventDefault();
    var tid = toolBtn.getAttribute('data-gotool');
    location.hash = tid ? '#/pristupy/' + tid : '#/pristupy';
    return;
  }

  var copyBtn = t.closest('[data-copy]');
  if(copyBtn){
    copyText(document.getElementById('tpl-' + copyBtn.getAttribute('data-copy')).textContent,
             'Šablona zkopírována');
    return;
  }

  if(t.closest('[data-sharelink]')){ copyText(shareLink(), 'Odkaz zkopírován'); return; }
  if(t.closest('[data-print]')){ window.print(); return; }

  if(t.closest('[data-reset]')){
    if(confirm('Opravdu vymazat všechny odškrtnuté kroky? Vyplněné údaje zůstanou.')){
      state.done = {};
      save();
      render();
      toast('Postup vynulován');
    }
    return;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(!t || !t.matches){ return; }

  if(t.matches('[data-task]')){
    state.done['t:' + t.getAttribute('data-task')] = t.checked;
    save();
    refresh();
    return;
  }

  if(t.matches('[data-step]')){
    state.done[t.getAttribute('data-step')] = t.checked;
    save();
    refresh();
    return;
  }

  if(t.matches('[data-scope]')){
    var key = t.getAttribute('data-key');
    state[t.getAttribute('data-scope')][key] = t.value.trim();
    save();
    document.getElementById('logoName').textContent = state.config.firma || 'Four Bros';
    /* Typ spolupráce mění, které kroky se zobrazují — je potřeba překreslit. */
    if(key === 'uvazek'){ render(); }
    return;
  }
});

/* Přepočítá ukazatele na místě, aby při odškrtnutí neposkočil scroll. */
function refresh(){
  renderChrome();

  var allPhases = PHASES.concat(ACCESS_STEPS);
  document.querySelectorAll('[data-phase]').forEach(function(el){
    var p = allPhases.filter(function(x){ return x.id === el.getAttribute('data-phase'); })[0];
    if(!p){ return; }
    var st = phaseStats(p);
    var count = el.querySelector('[data-count]');
    if(count){ count.textContent = st.done + '/' + st.total; }
  });

  var route = parseHash();

  if(route.route === 'navody' && route.id){
    var g = GUIDES.filter(function(x){ return x.id === route.id; })[0];
    var fill = document.querySelector('[data-barfill]');
    var label = document.querySelector('[data-barlabel]');
    if(g && fill){
      var gs = guideStats(g);
      fill.style.width = (gs.total ? Math.round(gs.done / gs.total * 100) : 0) + '%';
      if(label){ label.textContent = gs.done + ' / ' + gs.total; }
    }
    return;
  }

  var ring = document.querySelector('[data-ring]');
  if(ring){
    var s = taskStats();
    var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    ring.setAttribute('stroke-dashoffset', (RING_C * (1 - pct / 100)).toFixed(1));
    var num = document.querySelector('[data-ringpct]');
    if(num){ num.textContent = pct; }
    var kroky = document.querySelectorAll('.stat dd')[2];
    if(kroky){ kroky.textContent = s.done + ' / ' + s.total; }
  }
}

function copyText(text, msg){
  var ok = function(){ toast(msg); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else {
    fallbackCopy(text, ok);
  }
}

function fallbackCopy(text, ok){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); ok(); }
  catch(err){ toast('Kopírování se nepovedlo'); }
  document.body.removeChild(ta);
}

window.addEventListener('hashchange', render);

/* ============================================================
   11. START
   ============================================================ */
load();
readShared();
if(!location.hash){ location.hash = '#/uvod'; }
render();

if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  var ring0 = document.querySelector('[data-ring]');
  if(ring0){
    var target = ring0.getAttribute('stroke-dashoffset');
    ring0.setAttribute('stroke-dashoffset', RING_C.toFixed(1));
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ ring0.setAttribute('stroke-dashoffset', target); });
    });
  }
}

})();
</script>
