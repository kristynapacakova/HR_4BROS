<title>Onboarding — Four Bros</title>

<style>
/* ============================================================
   FOUR BROS — ONBOARDING
   Vizuální systém: navigační mapa.
   Vlasová kresba v primární barvě na bílém listu, přístrojové
   číslice pro údaje, fialová výhradně pro označení aktuální polohy.
   Barvy a písma podle Four Bros Brand Guidelines v1.0.
   ============================================================ */

:root{
  /* Značkové barvy (brandbook 4.2) */
  --navy:#194669;
  --alice:#F7F8FE;
  --lightgrey:#F4F4F4;
  --violet:#7E17E0;

  /* Role */
  --paper:#FFFFFF;
  --panel:#FFFFFF;
  --tint:#F7F8FE;
  --tint-2:#F4F4F4;
  --ink:#22384B;
  --ink-strong:#194669;
  --ink-soft:#5F7789;
  --ink-faint:#8CA0B2;
  --rule:#D3E0EC;
  --rule-soft:#E8EFF6;
  --graticule:rgba(25,70,105,.022);
  --fix:#7E17E0;
  --fix-ink:#7E17E0;
  --fix-wash:#F5EBFE;
  --on-fix:#FFFFFF;
  --lift:0 1px 1px rgba(25,70,105,.04);

  /* Písma — brandbook 5.1–5.4 */
  --display:'Serenity','Serenity Light','Futura','Avenir Next','Century Gothic','Questrial','Trebuchet MS',sans-serif;
  --body:'Roboto','Roboto Light','Helvetica Neue','Segoe UI',Arial,sans-serif;
  --instrument:'Roboto Mono','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace;

  /* Měřítko */
  --t-xs:0.75rem;
  --t-sm:0.8125rem;
  --t-base:1rem;
  --t-md:1.125rem;
  --t-lg:1.3125rem;
  --t-xl:clamp(1.4rem,2.1vw,1.75rem);
  --t-2xl:clamp(1.85rem,3.4vw,2.6rem);
  --t-3xl:clamp(2.4rem,5.5vw,3.75rem);

  --measure:64ch;
  --margin:264px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1D2E;
    --panel:#11293F;
    --tint:#152F47;
    --tint-2:#102639;
    --ink:#D4E3EF;
    --ink-strong:#FFFFFF;
    --ink-soft:#93AAC0;
    --ink-faint:#6B869C;
    --rule:#25486A;
    --rule-soft:#1B3A57;
    --graticule:rgba(150,190,225,.05);
    --fix:#B472FF;
    --fix-ink:#C795FF;
    --fix-wash:#2A1B48;
    --on-fix:#150A2B;
    --navy:#9FC0DA;
    --lift:0 1px 1px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1D2E;
  --panel:#11293F;
  --tint:#152F47;
  --tint-2:#102639;
  --ink:#D4E3EF;
  --ink-strong:#FFFFFF;
  --ink-soft:#93AAC0;
  --ink-faint:#6B869C;
  --rule:#25486A;
  --rule-soft:#1B3A57;
  --graticule:rgba(150,190,225,.05);
  --fix:#B472FF;
  --fix-ink:#C795FF;
  --fix-wash:#2A1B48;
  --on-fix:#150A2B;
  --navy:#9FC0DA;
  --lift:0 1px 1px rgba(0,0,0,.25);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  margin:0;
  color:var(--ink);
  /* Čistý bílý list — brandbook žádá, aby většinu plochy pokrývala bílá.
     Členění nese vlasová linka, ne výplň. */
  background:var(--paper);
  font-family:var(--body);
  font-weight:300;
  font-size:var(--t-base);
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- Typografie ---------- */
h1,h2,.display{
  font-family:var(--display);
  font-weight:300;
  color:var(--ink-strong);
  margin:0;
  line-height:1.08;
  letter-spacing:-.02em;
  text-wrap:balance;
}
h1{font-size:var(--t-2xl);}
h2{font-size:var(--t-xl);}
h3{
  font-family:var(--body);font-weight:700;font-size:var(--t-md);
  color:var(--ink-strong);margin:0;line-height:1.35;text-wrap:balance;
  letter-spacing:-.005em;
}
h4{font-family:var(--body);font-weight:700;font-size:var(--t-base);color:var(--ink-strong);margin:0;line-height:1.45;}
p{margin:0;max-width:var(--measure);text-wrap:pretty;}
strong{font-weight:700;color:var(--ink-strong);}
a{color:var(--fix-ink);text-underline-offset:3px;text-decoration-thickness:1px;}
/* Míra řádku platí jen pro čtený text, ne pro strukturní seznamy — ty musí
   držet šířku sloupce, jinak se rozpadne zarovnání s panely nad nimi. */
ul,ol{margin:0;padding-left:1.15rem;display:grid;gap:.4rem;max-width:var(--measure);}
.log,.steps,.course,.plates,.swatches{max-width:none;padding-left:0;gap:0;}
li::marker{color:var(--ink-faint);}

:focus-visible{outline:2px solid var(--fix);outline-offset:3px;border-radius:2px;}

/* Přístrojová role — všechny údaje, značky a počty */
.instr{
  font-family:var(--instrument);
  font-size:var(--t-xs);
  letter-spacing:.14em;
  text-transform:uppercase;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
  font-weight:400;
}
.stamp{
  font-family:var(--instrument);
  font-size:var(--t-xs);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin:0;
  font-weight:400;
}
.lede{font-size:var(--t-md);line-height:1.55;color:var(--ink);max-width:56ch;}

/* ============================================================
   KOSTRA
   ============================================================ */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);}
@media (min-width:960px){
  .app{grid-template-columns:var(--margin) minmax(0,1fr);}
}

/* ---------- Levý okraj mapy ---------- */
.margin{
  min-width:0;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:40;
  display:flex;flex-direction:column;gap:.9rem;
  padding:.85rem 1rem;
}
@media (min-width:960px){
  .margin{
    border-bottom:0;border-right:1px solid var(--rule);
    height:100vh;padding:2rem 1.5rem 1.5rem;gap:1.75rem;
    /* měřítková rýha podél vnitřní hrany */
    background-image:repeating-linear-gradient(
      to bottom,var(--rule) 0 1px,transparent 1px 16px);
    background-size:5px 100%;
    background-position:right 0 top 0;
    background-repeat:no-repeat;
  }
}

.ensign{display:flex;align-items:center;gap:.65rem;min-width:0;}
.ensign svg{width:30px;height:30px;flex:none;}
.ensign b{
  font-family:var(--display);font-size:1.2rem;font-weight:400;
  color:var(--ink-strong);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.helm{display:flex;gap:0;border:1px solid var(--rule);min-width:0;}
.helm button{
  flex:1;font-family:var(--instrument);font-size:var(--t-xs);
  letter-spacing:.12em;text-transform:uppercase;
  background:transparent;border:0;padding:.5rem .4rem;
  color:var(--ink-faint);cursor:pointer;white-space:nowrap;
  transition:color .15s ease,background .15s ease;
}
.helm button + button{border-left:1px solid var(--rule);}
.helm button[aria-pressed="true"]{background:var(--ink-strong);color:var(--paper);}

.index{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;min-width:0;}
.index::-webkit-scrollbar{display:none;}
@media (min-width:960px){
  .index{flex-direction:column;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
}
.index a{
  display:flex;align-items:center;gap:.7rem;
  padding:.6rem .75rem;color:var(--ink);text-decoration:none;
  font-size:var(--t-base);white-space:nowrap;line-height:1.3;
  border-left:2px solid transparent;
  transition:background .14s ease,border-color .14s ease;
}
@media (max-width:959px){
  .index a{border-left:0;border-bottom:2px solid transparent;padding:.5rem .7rem;}
}
.index a:hover{background:var(--tint);}
.index a[aria-current="page"]{
  border-color:var(--fix);color:var(--ink-strong);background:var(--tint);
}
.index a svg{width:18px;height:18px;flex:none;}
.index a .tally{
  margin-left:auto;font-family:var(--instrument);font-size:var(--t-xs);
  letter-spacing:.06em;color:var(--ink-faint);font-variant-numeric:tabular-nums;
}
@media (max-width:959px){.index a .tally{display:none;}}

.margin-foot{display:none;}
@media (min-width:960px){
  .margin-foot{display:grid;gap:.3rem;border-top:1px solid var(--rule-soft);padding-top:.9rem;}
}

/* ---------- Plocha ---------- */
.sheet{min-width:0;padding:clamp(1.5rem,3.5vw,3.25rem) clamp(1.15rem,3.5vw,3.25rem) 6rem;}
.view{max-width:790px;display:grid;gap:clamp(2rem,3.6vw,3rem);min-width:0;}
.stack{display:grid;gap:1rem;min-width:0;}
.stack-tight{display:grid;gap:.6rem;min-width:0;}

/* Titulek obrazovky s vlasovou linkou pod ním */
.masthead{display:grid;gap:.75rem;min-width:0;}
.masthead .rule{height:1px;background:var(--rule);margin-top:.35rem;}

/* ---------- Panely ---------- */
.plate{
  background:var(--panel);
  border:1px solid var(--rule);
  padding:clamp(1.1rem,2.4vw,1.6rem);
  display:grid;gap:.9rem;min-width:0;
  box-shadow:var(--lift);
}
.plate.tint{background:var(--tint);border-color:var(--rule-soft);box-shadow:none;}
.plate.bare{background:transparent;border:0;padding:0;box-shadow:none;}

/* Rohové značky — mapová konvence, jen na hlavním panelu */
.plate--corners{position:relative;}
.plate--corners::before,.plate--corners::after{
  content:"";position:absolute;width:9px;height:9px;pointer-events:none;
  border:1px solid var(--navy);opacity:.5;
}
.plate--corners::before{top:-1px;left:-1px;border-right:0;border-bottom:0;}
.plate--corners::after{bottom:-1px;right:-1px;border-left:0;border-top:0;}

.duo{display:grid;gap:1rem;min-width:0;}
@media (min-width:640px){.duo{grid-template-columns:1fr 1fr;}}
.trio{display:grid;gap:1rem;min-width:0;}
@media (min-width:700px){.trio{grid-template-columns:repeat(3,1fr);}}

/* ---------- Ikony (brandbook 6.1) ---------- */
.ic .stroke{fill:none;stroke:var(--navy);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.ic .detail{fill:none;stroke:var(--fix);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.ic .detail-fill{fill:var(--fix);stroke:none;}
.disc{
  width:40px;height:40px;border-radius:50%;background:var(--tint);
  border:1px solid var(--rule-soft);display:grid;place-items:center;flex:none;
}
.disc svg{width:20px;height:20px;}

/* ============================================================
   PŘÍSTROJ — hlavní ukazatel na přehledu
   ============================================================ */
.instrument{
  display:grid;gap:1.5rem;align-items:center;
  grid-template-columns:minmax(0,1fr);
}
@media (min-width:620px){
  .instrument{grid-template-columns:minmax(0,1fr) auto;gap:2rem;}
}
.gauge{position:relative;width:154px;height:154px;justify-self:center;flex:none;}
.gauge svg{width:100%;height:100%;display:block;}
.gauge .track{fill:none;stroke:var(--rule);stroke-width:1.5;}
.gauge .ticks{stroke:var(--rule);stroke-width:1;stroke-linecap:round;}
.gauge .arc{
  fill:none;stroke:var(--fix);stroke-width:5;stroke-linecap:butt;
  transition:stroke-dashoffset .9s cubic-bezier(.22,.61,.36,1);
}
.gauge-read{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:.1rem;
}
.gauge-read b{
  font-family:var(--display);font-size:2.1rem;font-weight:300;
  color:var(--ink-strong);line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.gauge-read span{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);
}

/* Řada odečtů oddělená svislými vlasovými linkami */
.readouts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  border-top:1px solid var(--rule);
}
@media (min-width:620px){.readouts{grid-template-columns:repeat(4,minmax(0,1fr));}}
.readout{padding:.9rem 1rem;display:grid;gap:.15rem;min-width:0;border-left:1px solid var(--rule-soft);}
.readout:first-child{border-left:0;padding-left:0;}
@media (max-width:619px){
  .readout:nth-child(odd){border-left:0;padding-left:0;}
  .readout:nth-child(n+3){border-top:1px solid var(--rule-soft);}
}
.readout dt{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-faint);
}
.readout dd{
  margin:0;font-family:var(--display);font-size:1.4rem;color:var(--ink-strong);
  font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.01em;
  overflow-wrap:anywhere;
}
.readout dd.small{font-family:var(--body);font-size:var(--t-base);font-weight:400;line-height:1.35;}

/* ============================================================
   KURZ — fáze jako waypointy na kurzové čáře
   ============================================================ */
.course{list-style:none;margin:0;padding:0;display:grid;gap:0;}
.leg{
  position:relative;
  padding:0 0 2.25rem 0;
  display:grid;gap:.9rem;min-width:0;
}
@media (min-width:720px){
  .leg{padding-left:5.75rem;}
  /* kurzová čára */
  .leg::before{
    content:"";position:absolute;left:14px;top:1.15rem;bottom:-1.15rem;
    width:1px;background:var(--rule);
  }
  .leg:last-child::before{display:none;}
}
.leg-mark{display:flex;align-items:center;gap:.7rem;min-width:0;}
@media (min-width:720px){
  .leg-mark{position:absolute;left:0;top:0;width:4.75rem;display:block;}
}
.leg-dot{
  width:29px;height:29px;flex:none;border-radius:50%;
  border:1px solid var(--navy);background:var(--paper);
  display:grid;place-items:center;position:relative;z-index:1;
}
.leg-dot i{width:7px;height:7px;border-radius:50%;background:var(--navy);display:block;}
.leg.done .leg-dot i{background:var(--navy);}
.leg.now .leg-dot{border-color:var(--fix);border-width:1.5px;}
.leg.now .leg-dot i{background:var(--fix);}
.leg.now .leg-dot::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1px solid var(--fix);opacity:.35;
}
.leg-day{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.1em;
  color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;
}
@media (min-width:720px){.leg-day{display:block;margin-top:.5rem;}}
.leg.now .leg-day{color:var(--fix-ink);}

.leg-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;min-width:0;}
.leg-head h2{font-size:var(--t-lg);}
.leg-tally{
  margin-left:auto;font-family:var(--instrument);font-size:var(--t-xs);
  letter-spacing:.08em;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.here{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.16em;
  text-transform:uppercase;color:var(--on-fix);background:var(--fix);
  padding:.1rem .45rem;white-space:nowrap;
}

/* ---------- Úkoly ---------- */
.log{
  list-style:none;margin:0;padding:0;display:grid;min-width:0;
  border:1px solid var(--rule);background:var(--panel);
}
.log li{border-bottom:1px solid var(--rule-soft);min-width:0;}
.log li:last-child{border-bottom:0;}
.entry{display:grid;gap:.3rem;padding:.7rem .95rem;min-width:0;}
.entry:hover{background:var(--tint);}
.entry-main{display:flex;gap:.85rem;align-items:flex-start;cursor:pointer;min-width:0;}
.entry .text{display:block;flex:1;min-width:0;line-height:1.5;overflow-wrap:anywhere;}
.entry input:checked ~ .text{color:var(--ink-faint);}
.entry input:checked ~ .text strong,
.entry input:checked ~ .text .set{color:var(--ink-faint);font-weight:400;}
/* Popisky pod větou zarovnané pod text, ne pod zaškrtávátko. */
.entry-sub{
  display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;
  padding-left:calc(18px + .85rem);
}
.owner{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);
}
.owner::before{content:"";display:inline-block;width:11px;height:1px;background:var(--rule);vertical-align:middle;margin-right:.45rem;}
.seelink{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--fix-ink);background:none;border:0;
  padding:0;cursor:pointer;flex:none;white-space:nowrap;
  border-bottom:1px solid currentColor;line-height:1.4;
}

input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:18px;height:18px;margin:.22rem 0 0;flex:none;
  border:1px solid var(--navy);background:var(--panel);
  cursor:pointer;display:grid;place-content:center;
  transition:background .14s ease,border-color .14s ease;
}
input[type="checkbox"]::after{
  content:"";width:9px;height:5px;
  border-left:1.75px solid var(--on-fix);border-bottom:1.75px solid var(--on-fix);
  transform:rotate(-45deg) scale(0);transition:transform .14s cubic-bezier(.3,1.4,.5,1);
}
input[type="checkbox"]:checked{background:var(--fix);border-color:var(--fix);}
input[type="checkbox"]:checked::after{transform:rotate(-45deg) scale(1);}

/* ---------- Návody ---------- */
.plates{display:grid;gap:0;border-top:1px solid var(--rule);min-width:0;}
@media (min-width:640px){.plates{grid-template-columns:1fr 1fr;}}
.chart{
  text-align:left;font-family:var(--body);font-size:var(--t-base);color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:1.15rem 1.1rem 1.25rem;cursor:pointer;
  display:grid;gap:.5rem;min-width:0;position:relative;
  transition:background .16s ease;
}
@media (min-width:640px){
  .chart:nth-child(odd){border-right:1px solid var(--rule);}
}
.chart:hover{background:var(--tint);}
.chart::after{
  content:"";position:absolute;left:0;top:-1px;width:0;height:2px;
  background:var(--fix);transition:width .22s ease;
}
.chart:hover::after{width:38px;}
.chart .top{display:flex;align-items:center;gap:.75rem;min-width:0;}
.chart h3{font-size:var(--t-base);flex:1;min-width:0;}
.chart p{font-size:var(--t-sm);color:var(--ink-soft);max-width:none;line-height:1.5;}
.chart .tally{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.06em;
  color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:none;
}
.chart .tally.full{color:var(--fix-ink);}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0;}
.steps li{display:flex;gap:1rem;align-items:flex-start;padding:.85rem .25rem;
  border-bottom:1px solid var(--rule-soft);min-width:0;}
.steps li:last-child{border-bottom:0;}
.steps li::before{
  counter-increment:s;content:counter(s,decimal-leading-zero);
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.08em;
  color:var(--ink-faint);min-width:1.6rem;line-height:1.7;flex:none;
  font-variant-numeric:tabular-nums;
}
.steps label{display:flex;gap:.85rem;align-items:flex-start;cursor:pointer;flex:1;min-width:0;}
.steps .text{display:block;flex:1;min-width:0;line-height:1.55;overflow-wrap:anywhere;}
.steps input:checked ~ .text{color:var(--ink-faint);}
.steps input:checked ~ .text strong,
.steps input:checked ~ .text .set{color:var(--ink-faint);font-weight:400;}

/* ---------- Měřicí pruh ---------- */
.gaugebar{display:grid;gap:.45rem;min-width:0;}
.gaugebar-nums{
  display:flex;justify-content:space-between;gap:1rem;
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-variant-numeric:tabular-nums;
}
.gaugebar-rule{height:3px;background:var(--tint-2);border:1px solid var(--rule-soft);}
.gaugebar-fill{height:100%;background:var(--fix);width:0;transition:width .45s cubic-bezier(.22,.61,.36,1);}

/* ---------- Ovládací prvky ---------- */
.act{
  font-family:var(--instrument);font-size:var(--t-xs);font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-fix);background:var(--fix);
  border:1px solid var(--fix);padding:.6rem 1.1rem;cursor:pointer;
  transition:opacity .15s ease;
}
.act:hover{opacity:.86;}
.act.line{background:transparent;color:var(--ink-strong);border-color:var(--rule);}
.act.line:hover{background:var(--tint);opacity:1;border-color:var(--navy);}
.acts{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;}

.back{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);background:none;border:0;
  padding:0;cursor:pointer;justify-self:start;
}
.back:hover{color:var(--fix-ink);}

/* ---------- Doplňovaná místa ---------- */
.gap{
  background:var(--fix-wash);color:var(--fix-ink);
  border-bottom:1px solid var(--fix);padding:0 .22rem;white-space:nowrap;
}
.set{font-weight:400;color:var(--ink-strong);}

/* ---------- Tabulky ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:var(--panel);min-width:0;}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm);min-width:460px;}
th,td{text-align:left;padding:.65rem .9rem;border-bottom:1px solid var(--rule-soft);vertical-align:top;line-height:1.5;}
th{
  font-family:var(--instrument);font-weight:400;font-size:var(--t-xs);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  white-space:nowrap;border-bottom-color:var(--rule);
}
tr:last-child td{border-bottom:0;}
td.fig{font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-soft);}

/* ---------- Poznámka ---------- */
.mark{
  border-left:2px solid var(--fix);background:var(--tint);
  padding:.9rem 1.15rem;display:grid;gap:.4rem;min-width:0;
}
.mark .stamp{color:var(--fix-ink);}

/* ---------- Barevné vzorky ---------- */
.swatches{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
  border:1px solid var(--rule);min-width:0;}
.swatch{border-right:1px solid var(--rule);min-width:0;}
.swatch:last-child{border-right:0;}
.swatch .chip{height:62px;}
.swatch .meta{padding:.5rem .6rem;display:grid;gap:.05rem;background:var(--panel);}
.swatch .meta b{font-size:var(--t-sm);color:var(--ink-strong);font-weight:700;}
.swatch .meta span{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.05em;
  color:var(--ink-faint);
}

/* ---------- Šablony ---------- */
.tpl{border:1px solid var(--rule);background:var(--panel);min-width:0;}
.tpl-head{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.6rem .6rem .6rem 1.1rem;border-bottom:1px solid var(--rule);
  background:var(--tint);
}
.tpl-body{
  padding:1.1rem;white-space:pre-wrap;font-family:var(--instrument);
  font-size:var(--t-sm);line-height:1.75;overflow-x:auto;color:var(--ink);
  letter-spacing:0;text-transform:none;
}

/* ---------- Formulář ---------- */
.form{display:grid;gap:1rem;min-width:0;}
@media (min-width:640px){.form.two{grid-template-columns:1fr 1fr;}}
.field{display:grid;gap:.3rem;min-width:0;}
.field label{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);
}
.field input{
  font-family:var(--body);font-size:var(--t-base);font-weight:300;
  color:var(--ink);background:var(--panel);
  border:0;border-bottom:1px solid var(--rule);border-radius:0;
  padding:.45rem .1rem;width:100%;
  transition:border-color .15s ease;
}
.field input::placeholder{color:var(--ink-faint);opacity:.75;}
.field input:focus{outline:none;border-bottom-color:var(--fix);border-bottom-width:1.5px;}
fieldset{border:0;padding:0;margin:0;display:grid;gap:1rem;min-width:0;}
legend{
  font-family:var(--instrument);font-size:var(--t-xs);letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-faint);padding:0;
  width:100%;border-bottom:1px solid var(--rule);padding-bottom:.5rem;margin-bottom:.35rem;
}

/* ---------- Hlášení ---------- */
.signal{
  position:fixed;left:50%;bottom:1.75rem;transform:translateX(-50%) translateY(160%);
  background:var(--ink-strong);color:var(--paper);
  padding:.65rem 1.15rem;font-family:var(--instrument);font-size:var(--t-xs);
  letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 6px 24px rgba(25,70,105,.18);z-index:90;
  transition:transform .3s cubic-bezier(.22,.61,.36,1);max-width:90vw;text-align:center;
}
.signal.up{transform:translateX(-50%) translateY(0);}

/* ---------- Nástup obsahu ---------- */
@keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
.view > *{animation:rise .42s cubic-bezier(.22,.61,.36,1) both;}
.view > *:nth-child(2){animation-delay:.05s;}
.view > *:nth-child(3){animation-delay:.09s;}
.view > *:nth-child(4){animation-delay:.13s;}
.view > *:nth-child(n+5){animation-delay:.16s;}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
  html{scroll-behavior:auto;}
}

/* ---------- Tisk ---------- */
@media print{
  :root{--paper:#fff;--panel:#fff;--tint:#F7F8FE;--ink:#22384B;--ink-strong:#194669;--rule:#C2D2E0;--graticule:transparent;}
  body{background-image:none;font-size:10pt;}
  .margin,.act,.back,.helm,.seelink,.signal{display:none!important;}
  .app{grid-template-columns:1fr;}
  .sheet{padding:0;}
  .view{max-width:none;}
  .view > *{animation:none;}
  .plate,.log,.tpl,.mark,.steps li,.leg{break-inside:avoid;}
  h1,h2{break-after:avoid;}
}

var STORE_KEY = 'fourbros-onboarding-app-v1';

var state = { role:'novacek', config:{}, profile:{}, done:{} };

SETTINGS.forEach(function(g){
  g.items.forEach(function(f){ if(f.def){ state.config[f.key] = f.def; } });
});

function merge(target, src){
  Object.keys(src).forEach(function(k){
    if(src[k] !== '' && src[k] != null){ target[k] = src[k]; }
  });
}

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw){ return; }
    var saved = JSON.parse(raw);
    if(!saved || typeof saved !== 'object'){ return; }
    if(saved.role){ state.role = saved.role; }
    if(saved.config){ merge(state.config, saved.config); }
    if(saved.profile){ merge(state.profile, saved.profile); }
    if(saved.done){ state.done = saved.done; }
  }catch(e){ /* úložiště nedostupné */ }
}

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* soukromý režim */ }
}

/* --- Sdílení odkazem --- */
function b64enc(str){
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(s){
  var b = s.replace(/-/g,'+').replace(/_/g,'/');
  while(b.length % 4){ b += '='; }
  var bytes = Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); });
  return new TextDecoder().decode(bytes);
}

function readShared(){
  var m = location.hash.match(/[?&]s=([^&]+)/);
  if(!m){ return; }
  try{
    var data = JSON.parse(b64dec(m[1]));
    if(data.config){ merge(state.config, data.config); }
    if(data.profile){ merge(state.profile, data.profile); }
    save();
  }catch(e){ /* poškozený odkaz */ }
}

function shareLink(){
  var payload = b64enc(JSON.stringify({ config:state.config, profile:state.profile }));
  return location.origin + location.pathname + '#/uvod?s=' + payload;
}

   7. POMOCNÍCI
   ============================================================ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var LABELS = {};
SETTINGS.forEach(function(g){ g.items.forEach(function(f){ LABELS[f.key] = f.ph || f.label; }); });
PROFILE.forEach(function(f){ LABELS[f.key] = f.ph || f.label; });
function labelFor(key){ return LABELS[key] || key; }

function valueOf(key){
  var v = state.profile[key];
  if(v == null || v === ''){ v = state.config[key]; }
  if(key === 'nastup' && v){ v = formatDate(v); }
  return (v == null || v === '') ? null : v;
}

/* Doplní {{klic}} vyplněnou hodnotou, jinak zvýrazní, že chybí. */
function fillIn(text){
  return String(text).replace(/\{\{(\w+)\}\}/g, function(_, key){
    var v = valueOf(key);
    return v ? '<span class="set">' + esc(v) + '</span>'
             : '<span class="gap">' + esc(labelFor(key)) + '</span>';
  });
}

/* Verze pro prostý text šablon. */
function fillInPlain(text){
  return String(text).replace(/\{\{(\w+)\}\}/g, function(_, key){
    var v = valueOf(key);
    return v ? v : '[' + labelFor(key).toUpperCase() + ']';
  });
}

function formatDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())){ return iso; }
  return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
}

function dayOffset(){
  if(!state.profile.nastup){ return null; }
  var start = new Date(state.profile.nastup);
  if(isNaN(start.getTime())){ return null; }
  start.setHours(0,0,0,0);
  var now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - start) / 86400000);
}

function dayStamp(){
  var d = dayOffset();
  if(d === null){ return '—'; }
  return d < 0 ? 'D−' + Math.abs(d) : 'D+' + d;
}

function currentPhase(){
  var d = dayOffset();
  if(d === null){ return null; }
  for(var i = 0; i < PHASES.length; i++){
    if(d >= PHASES[i].from && d <= PHASES[i].to){ return PHASES[i]; }
  }
  return d < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length - 1];
}

function phaseStats(p){
  var done = 0;
  p.tasks.forEach(function(t){ if(state.done['t:' + t.id]){ done++; } });
  return { total:p.tasks.length, done:done };
}

function taskStats(){
  var total = 0, done = 0;
  PHASES.forEach(function(p){
    var s = phaseStats(p);
    total += s.total;
    done += s.done;
  });
  return { total:total, done:done };
}

function guideStats(g){
  var done = 0;
  g.steps.forEach(function(_, i){ if(state.done['g:' + g.id + ':' + i]){ done++; } });
  return { total:g.steps.length, done:done };
}

function signal(msg){
  var el = document.getElementById('signal');
  el.textContent = msg;

/* Přístrojový oblouk — 270° s mezerou dole, jako na budíku.
   Úhly měřím ve stupních od horní osy po směru hodinových ručiček.
   Dráha má pathLength="100", takže postup v procentech je přímo dashoffset. */
var GAUGE = { cx:77, cy:77, r:57, start:-135, sweep:270 };

function gaugePoint(deg, rad){
  var a = deg * Math.PI / 180;
  return [GAUGE.cx + Math.sin(a) * rad, GAUGE.cy - Math.cos(a) * rad];
}

function gaugeArc(rad){
  var p0 = gaugePoint(GAUGE.start, rad);
  var p1 = gaugePoint(GAUGE.start + GAUGE.sweep, rad);
  return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
         'A' + rad + ' ' + rad + ' 0 ' + (GAUGE.sweep > 180 ? 1 : 0) + ' 1 ' +
         p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
}

function gaugeSvg(pct){
  var ticks = '';
  for(var i = 0; i <= 12; i++){
    var deg = GAUGE.start + GAUGE.sweep * (i / 12);
    var major = i % 3 === 0;
    var a = gaugePoint(deg, GAUGE.r + 6);
    var b = gaugePoint(deg, GAUGE.r + (major ? 13 : 9));
    ticks += '<line class="ticks"' + (major ? ' stroke-width="1.4"' : '') +
             ' x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) +
             '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '"/>';
  }
  var d = gaugeArc(GAUGE.r);
  return '<svg viewBox="0 0 154 154" aria-hidden="true">' +
    ticks +
    '<path class="track" d="' + d + '"/>' +
    '<path class="arc" data-arc d="' + d + '" pathLength="100" ' +
      'stroke-dasharray="100" stroke-dashoffset="' + (100 - pct) + '"/>' +
  '</svg>';
}

  h +=     jumpPlate('znacka','brand','Naše značka','Pravidla pro každého, kdo píše klientovi.');
  h +=   '</div>';

    h += '<div class="mark">';

  [['Odchody ve zkušební době','Počet za rok / počet nástupů','Nad 20 % zpravidla neselhává člověk, ale výběr nebo onboarding'],
   ['Doba do samostatnosti','Odhad manažera ve dnech','Sleduj trend, ne absolutní číslo'],
   ['Spokojenost ve 30. dni','Otázka 6 z dotazníku (0–10)','Pod 7 se ptej proč, konkrétně'],
   ['Splněné kroky','Kolik kroků v aplikaci je odškrtnutých','Ukáže, kde se proces láme v praxi']
  ].forEach(function(r){
    h += '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
  });
  h +=   '</tbody></table></div>';
  h += '</section>';

  h += '<section class="stack">';
  h +=   '<div class="masthead"><h2>Čeho se vyvarovat</h2><div class="rule"></div></div>';
  h +=   '<ul>';
  ['<strong>Nefunkční technika první den.</strong> Nejčastější stížnost nováčků vůbec. Otestuj přihlášení, ne jen objednávku.',
   '<strong>Manažer je první den na dovolené.</strong> Když to nejde jinak, posuň nástup.',
   '<strong>Den plný prezentací.</strong> Člověk si zapamatuje tři věci. Rozlož informace do týdnů.',
   '<strong>Buddy, který o tom neví.</strong> Zeptej se předem a dej mu na to čas v kapacitě.',
   '<strong>Žádný úkol první týden.</strong> Nuda a pocit zbytečnosti odradí rychleji než náročná práce.',
   '<strong>Zpětná vazba až na konci zkušebky.</strong> Pokud se to člověk dozví po třech měsících, je to selhání manažera, ne jeho.',
   '<strong>Onboarding jen pro nové lidi.</strong> Kdo mění pozici uvnitř firmy, potřebuje ho taky — jen kratší.'
  ].forEach(function(x){ h += '<li>' + x + '</li>'; });
  h +=   '</ul>';
  h += '</section>';

  return h;
}

/* ---------- Nastavení ---------- */
function viewNastaveni(){
  var h = '';
  h += '<div class="masthead">';
  h +=   '<p class="stamp">Nastavení</p>';
  h +=   '<h1>Vyplň jednou, propíše se všude</h1>';
  h +=   '<p class="lede">Cokoliv tady vyplníš, se doplní do všech návodů, úkolů i šablon e-mailů. Nevyplněná místa zůstanou zvýrazněná, abys viděla, co ještě chybí.</p>';
  h +=   '<div class="rule"></div>';
  h += '</div>';

  h += '<fieldset><legend>Nový kolega</legend><div class="form two">';
  PROFILE.forEach(function(f){ h += fieldHtml(f, state.profile[f.key] || '', 'profile'); });
  h += '</div></fieldset>';

  SETTINGS.forEach(function(g){
    h += '<fieldset><legend>' + esc(g.group) + '</legend><div class="form two">';
    g.items.forEach(function(f){ h += fieldHtml(f, state.config[f.key] || '', 'config'); });
    h += '</div></fieldset>';
  });

  h += '<div class="plate tint">';
  h +=   '<h3>Poslat aplikaci novému člověku</h3>';
  h +=   '<p>Odkaz v sobě nese všechno, co jsi vyplnila. Kdo ho otevře, uvidí rovnou konkrétní jména a systémy — a svůj vlastní postup si odškrtává u sebe.</p>';
  h +=   '<div class="acts">';
  h +=     '<button class="act" data-sharelink>Zkopírovat sdílecí odkaz</button>';
  h +=     '<button class="act line" data-reset>Vymazat odškrtnuté kroky</button>';
  h +=   '</div>';
  h += '</div>';

  h += '<div class="mark"><p class="stamp">Kde se data ukládají</p><p>Všechno zůstává jen v tomhle prohlížeči — nikam se neodesílá. Když aplikaci otevřeš na jiném počítači, začínáš s prázdným postupem. Odškrtnuté kroky se sdílecím odkazem <strong>nepřenášejí</strong>, jen vyplněné údaje.</p></div>';

  return h;
}

function fieldHtml(f, value, scope){
  return '<div class="field">' +
    '<label for="f-' + esc(f.key) + '">' + esc(f.label) + '</label>' +
    '<input id="f-' + esc(f.key) + '" type="' + (f.type || 'text') + '" value="' + esc(value) + '" ' +
    'placeholder="' + esc(f.ph || '') + '" data-scope="' + scope + '" data-key="' + esc(f.key) + '">' +
  '</div>';
}

/* ============================================================
   9. ROUTER
   ============================================================ */
function parseHash(){
  var raw = location.hash.replace(/^#\/?/, '').split('?')[0];
  var parts = raw.split('/').filter(Boolean);
  return { route: parts[0] || 'uvod', id: parts[1] || null };
}

function routeFor(id){
  return ROUTES.filter(function(r){ return r.id === id; })[0] || ROUTES[0];
}

function renderChrome(){
  var cur = parseHash().route;

  document.getElementById('helm').innerHTML =
    '<button data-role="novacek" aria-pressed="' + (state.role === 'novacek') + '">Nový kolega</button>' +
    '<button data-role="hr" aria-pressed="' + (state.role === 'hr') + '">HR</button>';

  var h = '';
  ROUTES.forEach(function(r){
    if(r.hrOnly && state.role !== 'hr'){ return; }
    var tally = '';
    if(r.id === 'plan'){
      var s = taskStats();
      tally = '<span class="tally">' + s.done + '/' + s.total + '</span>';
    }
    if(r.id === 'navody'){ tally = '<span class="tally">' + GUIDES.length + '</span>'; }
    h += '<a href="#/' + r.id + '"' + (r.id === cur ? ' aria-current="page"' : '') + '>' +
         svg(r.icon) + '<span>' + esc(r.label) + '</span>' + tally + '</a>';
  });
  document.getElementById('index').innerHTML = h;

  document.getElementById('ensignName').textContent = state.config.firma || 'Four Bros';

  var s2 = taskStats();
  document.getElementById('footRead').textContent =
    dayStamp() + ' · ' + s2.done + '/' + s2.total;
}

function render(){
  var p = parseHash();
  var r = routeFor(p.route);
  if(r.hrOnly && state.role !== 'hr'){ r = ROUTES[0]; }

  document.getElementById('sheet').innerHTML =
    '<div class="view">' + r.render({ id:p.id }) + '</div>';

  renderChrome();
  window.scrollTo(0, 0);
}

/* ============================================================
   10. UDÁLOSTI
   ============================================================ */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest){ return; }

  var roleBtn = t.closest('[data-role]');
  if(roleBtn){
    state.role = roleBtn.getAttribute('data-role');
    save();
    render();
    return;
  }

  var guideBtn = t.closest('[data-goguide]');
  if(guideBtn){
    var gid = guideBtn.getAttribute('data-goguide');
    location.hash = gid ? '#/navody/' + gid : '#/navody';
    return;
  }

  var copyBtn = t.closest('[data-copy]');
  if(copyBtn){
    var body = document.getElementById('tpl-' + copyBtn.getAttribute('data-copy'));
    copyText(body.textContent, 'Šablona zkopírována');
    return;
  }

  if(t.closest('[data-sharelink]')){
    copyText(shareLink(), 'Odkaz zkopírován');
    return;
  }

  if(t.closest('[data-print]')){ window.print(); return; }

  if(t.closest('[data-reset]')){
    if(confirm('Opravdu vymazat všechny odškrtnuté kroky? Vyplněné údaje zůstanou.')){
      state.done = {};
      save();
      render();
      signal('Postup vynulován');
    }
    return;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(!t || !t.matches){ return; }

  if(t.matches('[data-task]')){
    state.done['t:' + t.getAttribute('data-task')] = t.checked;
    save();
    refresh();
    return;
  }

  if(t.matches('[data-step]')){
    state.done[t.getAttribute('data-step')] = t.checked;
    save();
    refresh();
    return;
  }

  if(t.matches('[data-scope]')){
    state[t.getAttribute('data-scope')][t.getAttribute('data-key')] = t.value.trim();
    save();
    document.getElementById('ensignName').textContent = state.config.firma || 'Four Bros';
    return;
  }
});

/* Přepočítá ukazatele na místě, aby při odškrtnutí neposkočil scroll. */
function refresh(){
  renderChrome();

  var p = parseHash();

  document.querySelectorAll('.leg').forEach(function(el, i){
    var st = phaseStats(PHASES[i]);
    var tally = el.querySelector('.leg-tally');
    if(tally && PHASES[i]){
      tally.textContent = st.done + '/' + st.total + ' · ' + PHASES[i].when;
    }
    el.classList.toggle('done', st.total > 0 && st.done === st.total);
  });

  if(p.route === 'navody' && p.id){
    var g = GUIDES.filter(function(x){ return x.id === p.id; })[0];
    var fill = document.querySelector('[data-barfill]');
    var label = document.querySelector('[data-barlabel]');
    if(g && fill){
      var gs = guideStats(g);
      fill.style.width = (gs.total ? Math.round(gs.done / gs.total * 100) : 0) + '%';
      if(label){ label.textContent = gs.done + ' / ' + gs.total; }
    }
    return;
  }

  var arc = document.querySelector('[data-arc]');
  if(arc){
    var s = taskStats();
    var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    arc.setAttribute('stroke-dashoffset', String(100 - pct));
    var num = document.querySelector('[data-arcpct]');
    if(num){ num.textContent = pct; }
    var kroky = document.querySelectorAll('.readout dd')[2];
    if(kroky){ kroky.textContent = s.done + ' / ' + s.total; }
  }
}

function copyText(text, msg){
  var ok = function(){ signal(msg); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else {
    fallbackCopy(text, ok);
  }
}

function fallbackCopy(text, ok){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); ok(); }
  catch(err){ signal('Kopírování se nepovedlo'); }
  document.body.removeChild(ta);
}

window.addEventListener('hashchange', render);

   11. START
   ============================================================ */
load();
readShared();
if(!location.hash){ location.hash = '#/uvod'; }
render();

/* Oblouk vyjede z nuly, aby byl pohyb na první pohled čitelný. */
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  var arc0 = document.querySelector('[data-arc]');
  if(arc0){
    var target = arc0.getAttribute('stroke-dashoffset');
    arc0.setAttribute('stroke-dashoffset', '100');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ arc0.setAttribute('stroke-dashoffset', target); });
    });
  }
}

})();
