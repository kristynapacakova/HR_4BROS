<title>Onboarding — Four Bros</title>

<style>
/* ============================================================
   FOUR BROS — ONBOARDING APP
   Design systém podle Four Bros Brand Guidelines v1.0
   ============================================================ */

:root{
  --navy:#194669;
  --alice:#F7F8FE;
  --lightgrey:#F4F4F4;
  --violet:#7E17E0;

  --ground:#FFFFFF;
  --surface:#F7F8FE;
  --surface-2:#F4F4F4;
  --ink:#1B2F41;
  --ink-strong:#194669;
  --ink-muted:#5C7387;
  --hairline:#DDE5EE;
  --hairline-soft:#EAF0F6;
  --accent:#7E17E0;
  --accent-soft:#F3E9FE;
  --accent-ink:#7E17E0;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(25,70,105,.06), 0 8px 24px rgba(25,70,105,.06);

  --font-display:'Serenity','Serenity Light','Futura','Avenir Next','Century Gothic','Questrial','Trebuchet MS',sans-serif;
  --font-body:'Roboto','Roboto Light','Helvetica Neue','Segoe UI',Arial,sans-serif;

  --step--1:0.8125rem;
  --step-0:1rem;
  --step-1:1.125rem;
  --step-2:1.3125rem;
  --step-3:clamp(1.45rem,2.2vw,1.75rem);
  --step-4:clamp(1.75rem,3.4vw,2.5rem);

  --measure:66ch;
  --radius:4px;
  --rail:250px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D2032;
    --surface:#14304A;
    --surface-2:#102942;
    --ink:#DCE8F2;
    --ink-strong:#FFFFFF;
    --ink-muted:#93AAC0;
    --hairline:#23486A;
    --hairline-soft:#1B3A57;
    --accent:#B472FF;
    --accent-soft:#2A1B48;
    --accent-ink:#C795FF;
    --on-accent:#14082B;
    --navy:#DCE8F2;
    --alice:#14304A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0D2032;
  --surface:#14304A;
  --surface-2:#102942;
  --ink:#DCE8F2;
  --ink-strong:#FFFFFF;
  --ink-muted:#93AAC0;
  --hairline:#23486A;
  --hairline-soft:#1B3A57;
  --accent:#B472FF;
  --accent-soft:#2A1B48;
  --accent-ink:#C795FF;
  --on-accent:#14082B;
  --navy:#DCE8F2;
  --alice:#14304A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:300;
  font-size:var(--step-0);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

h1,h2{font-family:var(--font-display);font-weight:300;color:var(--ink-strong);margin:0;line-height:1.15;letter-spacing:-.015em;text-wrap:balance;}
h1{font-size:var(--step-4);}
h2{font-size:var(--step-3);}
h3{font-family:var(--font-body);font-weight:700;font-size:var(--step-1);color:var(--ink-strong);margin:0;line-height:1.4;text-wrap:balance;}
h4{font-family:var(--font-body);font-weight:700;font-size:var(--step-0);color:var(--ink-strong);margin:0;line-height:1.5;}
p{margin:0;max-width:var(--measure);}
strong{font-weight:700;color:var(--ink-strong);}
a{color:var(--accent-ink);text-underline-offset:3px;}
ul,ol{margin:0;padding-left:1.15rem;display:grid;gap:.4rem;max-width:var(--measure);}
li::marker{color:var(--ink-muted);}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px;}

.eyebrow{
  font-size:var(--step--1);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-muted);margin:0;
}

/* ================= APP SHELL ================= */
.app{min-height:100vh;display:grid;grid-template-columns:1fr;}
@media (min-width:900px){
  .app{grid-template-columns:var(--rail) minmax(0,1fr);}
}

/* --- Boční panel --- */
.rail{
  background:var(--surface);
  border-bottom:1px solid var(--hairline);
  display:flex;flex-direction:column;gap:1rem;
  padding:1rem;
  position:sticky;top:0;z-index:30;
  min-width:0;
}
@media (min-width:900px){
  .rail{
    border-bottom:0;border-right:1px solid var(--hairline);
    height:100vh;padding:1.5rem 1rem;gap:1.5rem;
  }
}

.brand{display:flex;align-items:center;gap:.6rem;padding:0 .35rem;}
.brand svg{width:28px;height:28px;flex:none;}
.brand span{font-family:var(--font-display);font-size:1.15rem;color:var(--ink-strong);letter-spacing:.02em;}

/* min-width:0 je tu nutné — bez něj se posuvná navigace neomezí na šířku
   rodiče a roztáhne celou stránku do strany. */
.nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.15rem;min-width:0;}
.nav::-webkit-scrollbar{display:none;}
@media (min-width:900px){
  .nav{flex-direction:column;overflow:visible;flex:1;min-height:0;overflow-y:auto;}
}
.nav a{
  display:flex;align-items:center;gap:.6rem;
  padding:.55rem .7rem;border-radius:var(--radius);
  color:var(--ink);text-decoration:none;font-size:var(--step-0);
  white-space:nowrap;line-height:1.3;
  border:1px solid transparent;
}
.nav a:hover{background:var(--ground);}
.nav a[aria-current="page"]{
  background:var(--ground);border-color:var(--hairline);
  color:var(--ink-strong);font-weight:400;box-shadow:var(--shadow);
}
.nav a .navicon{width:19px;height:19px;flex:none;}
.nav a .badge{
  margin-left:auto;font-size:var(--step--1);color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
@media (max-width:899px){.nav a .badge{display:none;}}

.rail-foot{display:none;}
@media (min-width:900px){
  .rail-foot{display:grid;gap:.5rem;padding:0 .35rem;font-size:var(--step--1);color:var(--ink-muted);}
}

/* --- Hlavní plocha --- */
.main{min-width:0;padding:clamp(1.5rem,4vw,3rem) clamp(1.25rem,4vw,3rem) 5rem;}
.screen{max-width:820px;display:grid;gap:clamp(1.75rem,3vw,2.5rem);}
.screen[hidden]{display:none;}
.screen-head{display:grid;gap:.6rem;}
.block{display:grid;gap:1rem;}

/* Položky gridu se samy nesmrští pod šířku svého obsahu (tabulky, dlouhé
   řetězce). Bez tohohle by široká tabulka roztáhla celou stránku do strany. */
.screen,.block,.card,.phase,.grid-2,.grid-3,.guide-grid,.table-wrap,
.tpl,.note,.form,.field,.steps,.steps li,.task,.task label{min-width:0;}
/* .text musí být blokový — na inline element se min-width nevztahuje a řádek
   s odznaky by se nezalomil. */
.task .text,.steps .text{display:block;flex:1;min-width:0;overflow-wrap:anywhere;}

/* ================= KOMPONENTY ================= */
.icon .stroke{fill:none;stroke:var(--navy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.icon .detail{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.icon .detail-fill{fill:var(--accent);stroke:none;}

.icon-circle{
  width:42px;height:42px;border-radius:50%;background:var(--alice);
  border:1px solid var(--hairline-soft);display:grid;place-items:center;flex:none;
}
.icon-circle svg{width:21px;height:21px;}

.card{
  background:var(--ground);border:1px solid var(--hairline);
  border-radius:var(--radius);padding:clamp(1.1rem,2.5vw,1.5rem);
  display:grid;gap:.85rem;
}
.card.tint{background:var(--surface);border-color:var(--hairline-soft);}
.card-head{display:flex;align-items:center;gap:.85rem;}

.grid-2{display:grid;gap:1rem;}
@media (min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
.grid-3{display:grid;gap:1rem;}
@media (min-width:700px){.grid-3{grid-template-columns:repeat(3,1fr);}}

.btn{
  font-family:var(--font-body);font-size:var(--step--1);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--on-accent);background:var(--accent);
  border:0;border-radius:2px;padding:.6rem 1.1rem;cursor:pointer;
  transition:opacity .15s ease;
}
.btn:hover{opacity:.85;}
.btn.ghost{
  background:transparent;color:var(--ink-strong);
  border:1px solid var(--hairline);
}
.btn.ghost:hover{background:var(--surface);opacity:1;}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;}

.pill{
  display:inline-block;font-size:var(--step--1);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-muted);
  border:1px solid var(--hairline);border-radius:2px;padding:.05rem .4rem;
  font-weight:400;white-space:nowrap;
}
.pill.now{color:var(--accent-ink);border-color:var(--accent);}

.fill{
  background:var(--accent-soft);color:var(--accent-ink);
  border-bottom:1px dashed var(--accent);padding:0 .25rem;white-space:nowrap;
}
.val{font-weight:400;color:var(--ink-strong);}

/* --- Postup / progress --- */
.meter{display:grid;gap:.5rem;}
.meter-bar{
  height:7px;border-radius:99px;background:var(--surface-2);
  overflow:hidden;border:1px solid var(--hairline-soft);
}
.meter-fill{height:100%;background:var(--accent);width:0;transition:width .35s ease;}
.meter-label{
  display:flex;justify-content:space-between;gap:1rem;
  font-size:var(--step--1);color:var(--ink-muted);font-variant-numeric:tabular-nums;
}

.stat{
  border-top:2px solid var(--navy);padding-top:.75rem;display:grid;gap:.1rem;
}
.stat dt{font-size:var(--step--1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);}
.stat dd{margin:0;font-family:var(--font-display);font-size:1.5rem;color:var(--ink-strong);font-variant-numeric:tabular-nums;}

/* --- Fáze a úkoly --- */
.phase{border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;background:var(--ground);}
.phase.is-now{border-color:var(--accent);}
.phase-head{
  display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;
  padding:.9rem 1.1rem;background:var(--surface);
  border-bottom:1px solid var(--hairline-soft);
}
.phase-head .when{font-size:var(--step--1);color:var(--ink-muted);letter-spacing:.08em;text-transform:uppercase;}
.phase-head .count{margin-left:auto;font-size:var(--step--1);color:var(--ink-muted);font-variant-numeric:tabular-nums;}
.tasks{list-style:none;margin:0;padding:0;display:grid;}
.tasks li{border-bottom:1px solid var(--hairline-soft);}
.tasks li:last-child{border-bottom:0;}

.task{display:flex;gap:.8rem;align-items:flex-start;padding:.75rem 1.1rem;}
.task:hover{background:var(--surface);}
.task label{display:flex;gap:.8rem;align-items:flex-start;cursor:pointer;flex:1;min-width:0;}
.task .text{line-height:1.5;}
.task input:checked ~ .text{color:var(--ink-muted);}
.task .meta{display:flex;gap:.4rem;align-items:center;margin-top:.3rem;flex-wrap:wrap;}
.task .howto{
  font-size:var(--step--1);color:var(--accent-ink);background:none;border:0;
  padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  font-family:var(--font-body);
}

input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:19px;height:19px;margin:.22rem 0 0;flex:none;
  border:1.5px solid var(--navy);border-radius:2px;background:var(--ground);
  cursor:pointer;display:grid;place-content:center;
  transition:background .12s ease,border-color .12s ease;
}
input[type="checkbox"]::after{
  content:"";width:10px;height:6px;
  border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);
  transform:rotate(-45deg) scale(0);transition:transform .12s ease;
}
input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent);}
input[type="checkbox"]:checked::after{transform:rotate(-45deg) scale(1);}

/* --- Návody --- */
.guide-grid{display:grid;gap:.85rem;}
@media (min-width:620px){.guide-grid{grid-template-columns:1fr 1fr;}}
.guide-card{
  text-align:left;font-family:var(--font-body);font-size:var(--step-0);
  background:var(--ground);border:1px solid var(--hairline);border-radius:var(--radius);
  padding:1.1rem;cursor:pointer;display:grid;gap:.5rem;color:var(--ink);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.guide-card:hover{border-color:var(--navy);box-shadow:var(--shadow);}
.guide-card .top{display:flex;align-items:center;gap:.75rem;}
.guide-card h3{font-size:var(--step-0);}
.guide-card p{font-size:var(--step--1);color:var(--ink-muted);max-width:none;}
.guide-card .state{
  font-size:var(--step--1);color:var(--ink-muted);
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap;
}
.guide-card .state.done{color:var(--accent-ink);}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:.6rem;counter-reset:s;}
.steps li{
  display:flex;gap:.9rem;align-items:flex-start;
  border:1px solid var(--hairline);border-radius:var(--radius);
  padding:.85rem 1rem;background:var(--ground);
}
.steps li::before{
  counter-increment:s;content:counter(s);
  font-family:var(--font-display);font-size:1.05rem;color:var(--accent-ink);
  min-width:1.4rem;line-height:1.5;font-variant-numeric:tabular-nums;
}
.steps label{display:flex;gap:.8rem;align-items:flex-start;cursor:pointer;flex:1;}
.steps .text{line-height:1.5;}
.steps input:checked ~ .text{color:var(--ink-muted);}

/* --- Formulář nastavení --- */
.form{display:grid;gap:1rem;}
.field{display:grid;gap:.3rem;}
.field label{font-size:var(--step--1);font-weight:700;color:var(--ink-strong);letter-spacing:.02em;}
.field .hint{font-size:var(--step--1);color:var(--ink-muted);}
.field input{
  font-family:var(--font-body);font-size:var(--step-0);font-weight:300;
  color:var(--ink);background:var(--ground);
  border:1px solid var(--hairline);border-radius:var(--radius);
  padding:.55rem .7rem;width:100%;
}
.field input::placeholder{color:var(--ink-muted);opacity:.7;}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft);}
.fieldset{display:grid;gap:1rem;border:0;padding:0;margin:0;}
.fieldset legend{
  font-size:var(--step--1);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-muted);padding:0;margin-bottom:.25rem;
}
@media (min-width:640px){.fieldset .form{grid-template-columns:1fr 1fr;}}

/* --- Šablony --- */
.tpl{border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;}
.tpl-head{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem .6rem .7rem 1.1rem;background:var(--surface);
  border-bottom:1px solid var(--hairline-soft);
}
.tpl-body{
  padding:1.1rem;white-space:pre-wrap;font-size:var(--step--1);
  line-height:1.7;overflow-x:auto;
}

/* --- Tabulky --- */
.table-wrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--radius);}
table{border-collapse:collapse;width:100%;font-size:var(--step--1);min-width:480px;}
th,td{text-align:left;padding:.65rem .9rem;border-bottom:1px solid var(--hairline-soft);vertical-align:top;line-height:1.5;}
th{background:var(--surface);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-strong);white-space:nowrap;}
tr:last-child td{border-bottom:0;}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;}

/* --- Poznámka --- */
.note{
  border-left:3px solid var(--accent);background:var(--surface);
  padding:.95rem 1.15rem;display:grid;gap:.45rem;border-radius:0 var(--radius) var(--radius) 0;
}
.note .eyebrow{color:var(--accent-ink);}

/* --- Vzorky barev --- */
.swatches{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));}
.swatch{border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;}
.swatch .chip{height:50px;}
.swatch .meta{padding:.5rem .65rem;display:grid;gap:.05rem;font-size:var(--step--1);}
.swatch .meta b{color:var(--ink-strong);}
.swatch .meta span{color:var(--ink-muted);font-variant-numeric:tabular-nums;}

/* --- Přepínač role --- */
.roleswitch{display:flex;gap:.25rem;background:var(--surface-2);border-radius:var(--radius);padding:.25rem;}
.roleswitch button{
  flex:1;font-family:var(--font-body);font-size:var(--step--1);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  background:transparent;border:0;border-radius:2px;padding:.45rem .5rem;
  color:var(--ink-muted);cursor:pointer;white-space:nowrap;
}
.roleswitch button[aria-pressed="true"]{background:var(--ground);color:var(--ink-strong);box-shadow:var(--shadow);}

.backlink{
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);
  font-size:var(--step--1);color:var(--accent-ink);letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;justify-self:start;
}

.toast{
  position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(150%);
  background:var(--ink-strong);color:var(--ground);
  padding:.7rem 1.2rem;border-radius:var(--radius);font-size:var(--step--1);
  box-shadow:var(--shadow);z-index:80;transition:transform .28s ease;max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
  html{scroll-behavior:auto;}
}

@media print{
  :root{--ground:#fff;--surface:#F7F8FE;--ink:#1B2F41;--ink-strong:#194669;--hairline:#C9D6E2;}
  .rail,.btn,.backlink,.roleswitch{display:none!important;}
  .app{grid-template-columns:1fr;}
  .main{padding:0;}
  .screen{max-width:none;}
  .card,.phase,.tpl,.note,.steps li{break-inside:avoid;}
}
</style>

<div class="app">

  <main class="main" id="main"></main>
</div>

var STORE_KEY = 'fourbros-onboarding-app-v1';

var state = {
  role:'novacek',
  config:{},
  profile:{},
  done:{}
};

SETTINGS.forEach(function(g){
  g.items.forEach(function(f){ if(f.def){ state.config[f.key] = f.def; } });
});

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var saved = JSON.parse(raw);
      if(saved && typeof saved === 'object'){
        if(saved.role){ state.role = saved.role; }
        if(saved.config){ merge(state.config, saved.config); }
        if(saved.profile){ merge(state.profile, saved.profile); }
        if(saved.done){ state.done = saved.done; }
      }
    }
  }catch(e){ /* nedostupné úložiště */ }
}

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* soukromý režim */ }
}

function merge(target, src){
  Object.keys(src).forEach(function(k){
    if(src[k] !== '' && src[k] != null){ target[k] = src[k]; }
  });
}

/* --- Sdílení odkazem --- */
function b64enc(str){
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(s){
  var b = s.replace(/-/g,'+').replace(/_/g,'/');
  while(b.length % 4){ b += '='; }
  var bin = atob(b);
  var bytes = Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
  return new TextDecoder().decode(bytes);
}

function readShared(){
  var m = location.hash.match(/[?&]s=([^&]+)/);
  if(!m){ return; }
  try{
    var data = JSON.parse(b64dec(m[1]));
    if(data.config){ merge(state.config, data.config); }
    if(data.profile){ merge(state.profile, data.profile); }
    save();
  }catch(e){ /* poškozený odkaz — ignoruj */ }
}

function shareLink(){
  var payload = b64enc(JSON.stringify({ config:state.config, profile:state.profile }));
  return location.origin + location.pathname + '#/uvod?s=' + payload;
}

/* ============================================================
   7. POMOCNÍCI
   ============================================================ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Nahradí {{klic}} vyplněnou hodnotou, nebo výzvou k doplnění. */
function fillIn(text){
  return String(text).replace(/\{\{(\w+)\}\}/g, function(_, key){
    var v = state.profile[key] != null && state.profile[key] !== '' ? state.profile[key] : state.config[key];
    if(key === 'nastup' && v){ v = formatDate(v); }
    if(v){ return '<span class="val">' + esc(v) + '</span>'; }
    return '<span class="fill">' + esc(labelFor(key)) + '</span>';
  });
}

/* Verze pro prostý text (šablony ke zkopírování). */
function fillInPlain(text){
  return String(text).replace(/\{\{(\w+)\}\}/g, function(_, key){
    var v = state.profile[key] != null && state.profile[key] !== '' ? state.profile[key] : state.config[key];
    if(key === 'nastup' && v){ v = formatDate(v); }
    return v ? v : '[' + labelFor(key).toUpperCase() + ']';
  });
}

var LABELS = {};
SETTINGS.forEach(function(g){ g.items.forEach(function(f){ LABELS[f.key] = f.ph || f.label; }); });
PROFILE.forEach(function(f){ LABELS[f.key] = f.ph || f.label; });

function labelFor(key){ return LABELS[key] || key; }

function formatDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())){ return iso; }
  return d.getDate() + '. ' + (d.getMonth()+1) + '. ' + d.getFullYear();
}

/* Kolikátý den onboardingu právě je (0 = den nástupu). */
function dayOffset(){
  if(!state.profile.nastup){ return null; }
  var start = new Date(state.profile.nastup);
  if(isNaN(start.getTime())){ return null; }
  start.setHours(0,0,0,0);
  var now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - start) / 86400000);
}

function currentPhase(){
  var d = dayOffset();
  if(d === null){ return null; }
  for(var i=0;i<PHASES.length;i++){
    if(d >= PHASES[i].from && d <= PHASES[i].to){ return PHASES[i]; }
  }
  return d < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length-1];
}

/* Úkoly viditelné pro aktuální roli. */
function visibleTasks(phase){
  if(state.role === 'hr'){ return phase.tasks; }
  return phase.tasks;
}

function taskStats(){
  var total = 0, done = 0;
  PHASES.forEach(function(p){
    visibleTasks(p).forEach(function(t){
      total++;
      if(state.done['t:'+t.id]){ done++; }
    });
  });
  return { total:total, done:done };
}

function guideStats(g){
  var done = 0;
  g.steps.forEach(function(_, i){ if(state.done['g:'+g.id+':'+i]){ done++; } });
  return { total:g.steps.length, done:done };
}

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

  var d = dayOffset();
  var jmeno = state.profile.jmeno;

  var greeting = state.role === 'novacek'
    ? (jmeno ? 'Vítej, ' + esc(jmeno.split(' ')[0]) : 'Vítej na palubě')
    : 'Onboarding' + (jmeno ? ' — ' + esc(jmeno) : '');

  var sub = state.role === 'novacek'
    ? 'Tohle je tvůj průvodce prvními měsíci. Odškrtávej si, co máš za sebou — postup se ti uloží a příště naváže tam, kde jsi skončil.'
    : 'Průvodce celým nástupem. Vyplň jednou Nastavení, pošli odkaz novému člověku a sleduj, jak mu to jde.';

  var h = '';
  h += '<div class="screen-head">';
  h +=   '<p class="eyebrow">' + (state.profile.pozice ? esc(state.profile.pozice) : 'Onboarding od A po Z') + '</p>';
  h +=   '<h1>' + greeting + '</h1>';
  h +=   '<p>' + sub + '</p>';
  h += '</div>';

  h += '<div class="card">';
  h +=   '<div class="meter">';
  h +=     '<div class="meter-label"><span>Celkový postup</span><span>' + s.done + ' z ' + s.total + ' kroků · ' + pct + ' %</span></div>';
  h +=     '<div class="meter-bar"><div class="meter-fill" style="width:' + pct + '%"></div></div>';
  h +=   '</div>';
  h += '</div>';

  h += '<div class="grid-3">';
  h +=   '<dl class="stat"><dt>Den onboardingu</dt><dd>' + (d === null ? '—' : (d < 0 ? d : 'D+' + d)) + '</dd></dl>';
  h +=   '<dl class="stat"><dt>Aktuální fáze</dt><dd style="font-size:1.05rem;line-height:1.35">' + (phase ? esc(phase.title) : 'Doplň datum') + '</dd></dl>';
  h +=   '<dl class="stat"><dt>Návodů</dt><dd>' + GUIDES.length + '</dd></dl>';
  h += '</div>';

  /* Nejbližší nesplněné kroky */
  var next = [];
  PHASES.forEach(function(p){
    visibleTasks(p).forEach(function(t){
      if(!state.done['t:'+t.id] && next.length < 5){ next.push({ p:p, t:t }); }
    });
  });

  if(next.length){
    h += '<div class="block">';
    h +=   '<h2>Co je na řadě</h2>';
    h +=   '<div class="phase"><ul class="tasks">';
    next.forEach(function(n){
      h += taskRow(n.t, n.p);
    });
    h +=   '</ul></div>';
    h += '</div>';
  } else if(taskStats().total){
    h += '<div class="note"><p class="eyebrow">Hotovo</p><p>Všechny kroky jsou odškrtnuté. Onboarding je za tebou.</p></div>';
  }

  h += '<div class="block">';
  h +=   '<h2>Kde začít</h2>';
  h +=   '<div class="grid-2">';
  h +=     linkCard('plan','plan','Projít postup','Sedm fází od příprav před nástupem po první rok.');
  h +=     linkCard('navody','guide','Otevřít návody','Krok za krokem: systémy, podpis, docházka, schůzky.');
  h +=     linkCard('lide','people','Na co se koho ptát','Buddy, nadřízený, HR a IT — kdo řeší co.');
  h +=     linkCard('znacka','brand','Naše značka','Pravidla, která musí znát každý, kdo píše klientovi.');
  h +=   '</div>';
  h += '</div>';

  if(!state.profile.nastup || !state.config.crm){
    h += '<div class="note">';
    h +=   '<p class="eyebrow">Ještě není vyplněno</p>';
    h +=   '<p>Appka umí doplňovat konkrétní jména a systémy do všech textů. Vyplň je jednou v <a href="#/nastaveni">Nastavení</a> a propíšou se všude — včetně šablon e-mailů.</p>';
    h += '</div>';
  }

  return h;
}

function renderPlan(){
  var cur = currentPhase();
  var h = '';
  h += '<div class="screen-head">';
  h +=   '<p class="eyebrow">Postup</p>';
  h +=   '<h1>Sedm fází nástupu</h1>';
  h +=   '<p>Od dvou týdnů před nástupem po konec prvního roku. Odškrtnuté kroky se ukládají v tomhle prohlížeči.</p>';
  h += '</div>';

  PHASES.forEach(function(p){
    var tasks = visibleTasks(p);
    var done = tasks.filter(function(t){ return state.done['t:'+t.id]; }).length;
    var isNow = cur && cur.id === p.id;

    h += '<section class="phase' + (isNow ? ' is-now' : '') + '">';
    h +=   '<div class="phase-head">';
    h +=     '<div><h3>' + esc(p.title) + '</h3><span class="when">' + esc(p.when) + '</span></div>';
    if(isNow){ h += '<span class="pill now">Teď</span>'; }
    h +=     '<span class="count">' + done + '/' + tasks.length + '</span>';
    h +=   '</div>';

    if(p.intro){
      h += '<div style="padding:1rem 1.1rem 0"><p>' + p.intro + '</p></div>';
    }

    if(p.agenda){
      h += '<div style="padding:1rem 1.1rem 0"><div class="table-wrap"><table>';
      h += '<thead><tr><th>Čas</th><th>Co se děje</th><th>Kdo vede</th></tr></thead><tbody>';
      p.agenda.forEach(function(r){
        h += '<tr><td class="num">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }

    h += '<ul class="tasks" style="margin-top:1rem">';
    tasks.forEach(function(t){ h += taskRow(t, null); });
    h += '</ul>';
    h += '</section>';
  });

  return h;
}

function taskRow(t, phase){
  var checked = state.done['t:'+t.id] ? ' checked' : '';
  var h = '<li><div class="task">';
  h += '<label><input type="checkbox" data-task="' + esc(t.id) + '"' + checked + '>';
  h += '<span class="text">' + fillIn(t.t);
  h += '<span class="meta"><span class="pill">' + esc(t.who) + '</span>';
  if(phase){ h += '<span class="pill">' + esc(phase.when) + '</span>'; }
  h += '</span></span></label>';
  if(t.guide){
    h += '<button class="howto" data-goguide="' + esc(t.guide) + '">Návod</button>';
  }
  h += '</div></li>';
  return h;
}

/* ============================================================
   9. ROUTER
   ============================================================ */
function parseHash(){
  var raw = location.hash.replace(/^#\/?/, '');
  raw = raw.split('?')[0];
  var parts = raw.split('/').filter(Boolean);
  return { route: parts[0] || 'uvod', id: parts[1] || null };
}

function routeFor(id){
  return ROUTES.filter(function(r){ return r.id === id; })[0] || ROUTES[0];
}

function renderNav(){
  var cur = parseHash().route;
  var nav = document.getElementById('nav');
  var h = '';

  h += '<div class="roleswitch" role="group" aria-label="Zobrazit jako">';
  h +=   '<button data-role="novacek" aria-pressed="' + (state.role === 'novacek') + '">Nový kolega</button>';
  h +=   '<button data-role="hr" aria-pressed="' + (state.role === 'hr') + '">HR</button>';
  h += '</div>';

  ROUTES.forEach(function(r){
    if(r.hrOnly && state.role !== 'hr'){ return; }
    var badge = '';
    if(r.id === 'plan'){
      var s = taskStats();
      badge = '<span class="badge">' + s.done + '/' + s.total + '</span>';
    }
    if(r.id === 'navody'){
      badge = '<span class="badge">' + GUIDES.length + '</span>';
    }
    h += '<a href="#/' + r.id + '"' + (r.id === cur ? ' aria-current="page"' : '') + '>' +
         svg(r.icon, 'navicon') + '<span>' + esc(r.label) + '</span>' + badge + '</a>';
  });

  nav.innerHTML = h;
}

function render(){
  var p = parseHash();
  var r = routeFor(p.route);
  if(r.hrOnly && state.role !== 'hr'){ r = ROUTES[0]; }

  document.getElementById('main').innerHTML =
    '<div class="screen">' + r.render({ id:p.id }) + '</div>';

  document.getElementById('brandName').textContent = state.config.firma || 'Four Bros';
  renderNav();
  window.scrollTo(0, 0);
}

/* ============================================================
   10. UDÁLOSTI
   ============================================================ */
document.addEventListener('click', function(e){
  var t = e.target;

  var roleBtn = t.closest('[data-role]');
  if(roleBtn){
    state.role = roleBtn.getAttribute('data-role');
    save();
    render();
    return;
  }

  var guideBtn = t.closest('[data-goguide]');
  if(guideBtn){
    var gid = guideBtn.getAttribute('data-goguide');
    location.hash = gid ? '#/navody/' + gid : '#/navody';
    return;
  }

  var copyBtn = t.closest('[data-copy]');
  if(copyBtn){
    var body = document.getElementById('tpl-' + copyBtn.getAttribute('data-copy'));
    copyText(body.textContent, 'Šablona zkopírována');
    return;
  }

  if(t.closest('[data-sharelink]')){
    copyText(shareLink(), 'Odkaz zkopírován — pošli ho novému kolegovi');
    return;
  }

  if(t.closest('[data-print]')){
    window.print();
    return;
  }

  if(t.closest('[data-reset]')){
    if(confirm('Opravdu vymazat všechny odškrtnuté kroky? Vyplněné údaje zůstanou.')){
      state.done = {};
      save();
      render();
      toast('Postup vynulován');
    }
    return;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;

  if(t.matches('[data-task]')){
    state.done['t:' + t.getAttribute('data-task')] = t.checked;
    save();
    refreshCounters();
    return;
  }

  if(t.matches('[data-step]')){
    state.done[t.getAttribute('data-step')] = t.checked;
    save();
    refreshCounters();
    return;
  }

  if(t.matches('[data-scope]')){
    var scope = t.getAttribute('data-scope');
    var key = t.getAttribute('data-key');
    state[scope][key] = t.value.trim();
    save();
    document.getElementById('brandName').textContent = state.config.firma || 'Four Bros';
    return;
  }
});

/* Přepočítá ukazatele bez překreslení celé obrazovky, aby nepřeskočil scroll. */
function refreshCounters(){
  renderNav();

  var route = parseHash();

  document.querySelectorAll('.phase').forEach(function(el){
    var boxes = el.querySelectorAll('[data-task]');
    var count = el.querySelector('.count');
    if(count && boxes.length){
      var done = el.querySelectorAll('[data-task]:checked').length;
      count.textContent = done + '/' + boxes.length;
    }
  });

  var meterFill = document.querySelector('.meter-fill');
  var meterLabel = document.querySelector('.meter-label span:last-child');

  if(route.route === 'navody' && route.id){
    var g = GUIDES.filter(function(x){ return x.id === route.id; })[0];
    if(g && meterFill){
      var gs = guideStats(g);
      meterFill.style.width = (gs.total ? Math.round(gs.done/gs.total*100) : 0) + '%';
      if(meterLabel){ meterLabel.textContent = gs.done + ' z ' + gs.total; }
    }
    return;
  }

  if(meterFill){
    var s = taskStats();
    var pct = s.total ? Math.round(s.done/s.total*100) : 0;
    meterFill.style.width = pct + '%';
    if(meterLabel){ meterLabel.textContent = s.done + ' z ' + s.total + ' kroků · ' + pct + ' %'; }
  }
}

function copyText(text, msg){
  var done = function(){ toast(msg); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(err){ toast('Kopírování se nepovedlo — označ text ručně'); }
  document.body.removeChild(ta);
}

window.addEventListener('hashchange', render);
