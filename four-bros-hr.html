function storeBanner() {
  const parts = [];
  if (state.storeState === "none") parts.push("Ukládání tu není dostupné – otevři stránku přihlášená na claude.ai, jinak se změny po zavření ztratí.");
  if (!state.aiReady) parts.push("Vyhodnocení přepisů přes Clauda v tomhle zobrazení nejde. Lidi, kalendář i poznámky fungují normálně.");
  return parts.length ? `<div class="banner" style="margin-bottom:16px">${parts.join("<br>")}</div>` : "";
}

function viewDashboard() {
  const people = state.db.people.filter((p) => !p.archived);
  if (!people.length) {
    return storeBanner() + emptyState(
      "Vítej v HR check-inech 👋",
      "Přidej prvního nováčka. Appka mu podle data nástupu naplánuje check-iny na první 3 měsíce a pak ti z přepisů ukáže semafor.",
      `<div class="row" style="justify-content:center"><button class="btn" data-action="add-person">Přidat člověka</button></div>`,
    );
  }
  const today = todayIso();
  const meetings = allMeetings();
  const overdue = meetings.filter((m) => !m.done && m.date < today);
  const upcoming = meetings.filter((m) => !m.done && m.date >= today && diffDays(today, m.date) <= 21);
  const inOnboarding = people.filter((p) => onboardingDay(p) <= ONBOARDING_DAYS);
  const weekCount = meetings.filter((m) => !m.done && m.date >= today && diffDays(today, m.date) < 7).length;
  const reds = people.filter((p) => personStatus(p) === "red");

  const meetingItem = (m) => `
    <li>
      ${dateBadge(m.date, m.date < today)}
      <div style="flex:1;min-width:0">
        <a href="#/clovek/${m.person.id}"><b>${esc(m.person.name)}</b></a>
        <div class="small muted">${esc(m.cp.label)} · ${relDays(diffDays(today, m.date))}</div>
      </div>
      ${m.date < today ? `<span class="chip red">Po termínu</span>` : ""}
    </li>`;

  const sorted = [...people].sort((a, b) => {
    const rank = { red: 0, orange: 1, green: 2 };
    return (rank[personStatus(a)] ?? 3) - (rank[personStatus(b)] ?? 3);
  });

  return `
    ${storeBanner()}
    <div class="section-head"><h1>Ahoj, tady je přehled</h1><button class="btn" data-action="add-person">+ Přidat člověka</button></div>
    <div class="grid grid-4">
      <div class="card stat"><div class="stat-value">${inOnboarding.length}</div><div class="stat-label">lidí v adaptaci</div></div>
      <div class="card stat"><div class="stat-value">${weekCount}</div><div class="stat-label">check-inů tento týden</div></div>
      <div class="card stat ${overdue.length ? "alert" : ""}"><div class="stat-value">${overdue.length}</div><div class="stat-label">schůzek po termínu</div></div>
      <div class="card stat ${reds.length ? "alert" : ""}"><div class="stat-value">${reds.length}</div><div class="stat-label">lidí na červené</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:16px">
      <div class="card">
        <h2>Nejbližší check-iny</h2>
        ${overdue.length + upcoming.length
          ? `<ul class="meeting-list">${[...overdue, ...upcoming].map(meetingItem).join("")}</ul>`
          : `<p class="muted">V příštích 3 týdnech nic naplánovaného. 🎉</p>`}
      </div>
      <div class="card">
        <h2>Semafor týmu</h2>
        <ul class="meeting-list">
          ${sorted.map((p) => `
            <li>
              ${avatar(p)}
              <div style="flex:1;min-width:0">
                <a href="#/clovek/${p.id}"><b>${esc(p.name)}</b></a>
                <div class="small muted">${esc(p.role || "")}${p.role ? " · " : ""}${dayLabel(p)}</div>
              </div>
              ${chip(personStatus(p))}
            </li>`).join("")}
        </ul>
      </div>
    </div>`;
}

function viewPeople() {
  const showArchived = state.showArchived === true;
  const people = state.db.people
    .filter((p) => showArchived || !p.archived)
    .sort((a, b) => b.startDate.localeCompare(a.startDate));
  const today = todayIso();
  return `
    <div class="section-head">
      <h1>Lidé</h1>
      <div class="row">
        <label class="row small" style="margin:0;font-weight:500"><input type="checkbox" data-action="toggle-archived" ${showArchived ? "checked" : ""} style="width:auto"> zobrazit archiv</label>
        <button class="btn" data-action="add-person">+ Přidat člověka</button>
      </div>
    </div>
    ${people.length ? `
    <div class="card table-wrap">
      <table>
        <thead><tr><th>Jméno</th><th>Pozice / tým</th><th>Nástup</th><th style="min-width:140px">Adaptace</th><th>Další check-in</th><th>Semafor</th></tr></thead>
        <tbody>
          ${people.map((p) => {
            const next = nextMeeting(p);
            return `
            <tr class="clickable" data-href="#/clovek/${p.id}">

              <td>${next ? `${fmtDate(next.date)}<div class="small ${next.date < today ? "" : "muted"}" ${next.date < today ? 'style="color:var(--red)"' : ""}>${esc(next.cp.label)} · ${relDays(diffDays(today, next.date))}</div>` : `<span class="muted">vše hotovo</span>`}</td>

            <div class="small muted">Nástup ${fmtDate(p.startDate)}${p.lead ? ` · leader/buddy: ${esc(p.lead)}` : ""}${p.email ? ` · <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""}</div>

        <button class="btn secondary sm" data-action="archive-person" data-id="${p.id}">${p.archived ? "Vrátit z archivu" : "Archivovat"}</button>

function phaseGuide(cp, done) {
  const qs = cp.questions || [];
  if (!cp.goal && !qs.length && !cp.greenCriteria && !cp.redCriteria) return "";
  return `
    <details class="guide" ${done ? "" : "open"}>
      <summary>Tahák na schůzku${qs.length ? ` · ${qs.length} ${plural(qs.length, "otázka", "otázky", "otázek")}` : ""}</summary>
      ${cp.goal ? `<p class="small" style="margin:10px 0 0"><b>Cíl:</b> ${esc(cp.goal)}</p>` : ""}
      ${qs.length ? `<ol class="questions">${qs.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>` : ""}
      <div class="grid grid-2" style="gap:10px">
        ${cp.greenCriteria ? `<div class="crit green"><b>🟢 Green flag:</b> ${esc(cp.greenCriteria)}</div>` : ""}
        ${cp.redCriteria ? `<div class="crit red"><b>🔴 Red flag:</b> ${esc(cp.redCriteria)}</div>` : ""}
      </div>
    </details>`;
}

function checkinCard(p, cp, today) {
  const ci = p.checkins?.[cp.id];
  const date = checkinDate(p, cp);
  const done = isDone(ci);
  const status = checkinStatus(ci);
  const key = `${p.id}:${cp.id}`;
  const busy = state.analyzing.has(key);
  const overdue = !done && date < today;

  return `
  <div class="card checkin ${status || ""}" id="ci-${cp.id}">
    <div class="checkin-head">
      <div>
        <h3>${esc(cp.label)}</h3>
        <div class="row small muted" style="gap:6px;margin-top:4px">
          <span class="chip blue">${esc(cp.window || `${cp.day}. den`)}</span>
          ${cp.duration ? `<span class="chip">${esc(cp.duration)}</span>` : ""}
          <span>${esc(cp.focus || "")}</span>
        </div>
      </div>
      <div class="row">
        ${overdue ? `<span class="chip red">Po termínu</span>` : done ? `<span class="chip blue">Proběhlo</span>` : `<span class="chip">${relDays(diffDays(today, date))}</span>`}
        ${chip(status)}
      </div>
    </div>
    ${phaseGuide(cp, done)}

    <div class="fields-2" style="margin-top:14px">
      <div>
        <label for="d-${p.id}-${cp.id}">Datum a čas schůzky</label>
        <div class="row" style="flex-wrap:nowrap">
          <input id="d-${p.id}-${cp.id}" type="date" value="${date}" data-change="ci-date" data-id="${p.id}" data-cp="${cp.id}" style="flex:2;min-width:0">
          <input id="t-${p.id}-${cp.id}" type="time" value="${checkinTime(ci)}" data-change="ci-time" data-id="${p.id}" data-cp="${cp.id}" aria-label="Čas schůzky" style="flex:1;min-width:0">
        </div>
        ${ci?.gcal?.eventId
          ? `<div class="small" style="margin-top:4px">📅 V Google Kalendáři · <a href="https://calendar.google.com/calendar/r/day/${date.replace(/-/g, "/")}" target="_blank" rel="noopener">otevřít</a></div>`
          : !done
            ? state.mcp
              ? `<div class="small muted" style="margin-top:4px">Zatím není v Google Kalendáři – zapíše se tlačítkem nahoře u člověka.</div>`
              : `<div class="small" style="margin-top:4px">Přidat do kalendáře: <a href="${gcalLink(p, cp, date)}" target="_blank" rel="noopener">Google</a> · <a href="${outlookLink(p, cp, date)}" target="_blank" rel="noopener">Outlook</a></div>`
            : ""}
      </div>
      <div>
        <label>Ruční úprava semaforu</label>
        <select data-change="ci-manual" data-id="${p.id}" data-cp="${cp.id}">
          <option value="">${ci?.analysis ? `Podle analýzy (${STATUS_LABEL[ci.analysis.overall]})` : "— bez ruční úpravy —"}</option>
          ${["green", "orange", "red"].map((s) => `<option value="${s}" ${ci?.manualStatus === s ? "selected" : ""}>${STATUS_LABEL[s]}</option>`).join("")}
        </select>
      </div>
    </div>

    <div style="margin-top:14px">
      ${ci?.transcript
        ? `<details class="transcript"><summary>Přepis (${ci.transcript.length.toLocaleString("cs-CZ")} znaků)</summary><pre>${esc(ci.transcript)}</pre></details>
           <div class="row" style="margin-top:10px">
             ${busy
               ? `<button class="btn aqua" disabled><span class="spinner"></span> Claude čte přepis…</button><button class="btn secondary sm" data-action="stop-analyze" data-id="${p.id}" data-cp="${cp.id}">Zastavit</button>`
               : `<button class="btn aqua" data-action="analyze" data-id="${p.id}" data-cp="${cp.id}" ${!state.aiReady ? "disabled" : ""}>${ci.analysis ? "Vyhodnotit znovu" : "Vyhodnotit semafor"}</button>`}
             <button class="btn secondary sm" data-action="upload" data-id="${p.id}" data-cp="${cp.id}">Nahradit přepis</button>
             <button class="btn danger sm" data-action="remove-transcript" data-id="${p.id}" data-cp="${cp.id}">Smazat přepis</button>
           </div>
           ${busy ? `<p class="small muted">Trvá to obvykle 1–2 minuty. Poprvé se tě claude.ai zeptá, jestli stránka smí Clauda použít.</p>` : ""}
           ${!state.aiReady ? `<p class="small muted">Vyhodnocení přes Clauda v tomhle zobrazení nejde.</p>` : ""}`
        : `<div class="dropzone" data-drop data-id="${p.id}" data-cp="${cp.id}">
             <p style="margin:0 0 10px">Přetáhni sem přepis (.txt, .md, .vtt, .srt) nebo</p>
             <div class="row" style="justify-content:center">
               <button class="btn secondary sm" data-action="upload" data-id="${p.id}" data-cp="${cp.id}">Vybrat soubor</button>
               <button class="btn secondary sm" data-action="paste" data-id="${p.id}" data-cp="${cp.id}">Vložit text</button>
               ${!done ? `<button class="btn link small" data-action="mark-done" data-id="${p.id}" data-cp="${cp.id}">jen označit jako proběhlé</button>` : ""}
             </div>
           </div>`}
    </div>

    ${ci?.analysis ? analysisBlock(ci.analysis) : ""}

    <div style="margin-top:14px">
      <label>Poznámky ke schůzce</label>
      <textarea data-change="ci-notes" data-id="${p.id}" data-cp="${cp.id}" placeholder="Domluvené kroky, co sledovat příště…">${esc(ci?.notes || "")}</textarea>
    </div>
  </div>`;
}

function analysisBlock(a) {
  const values = a.values || [];
  const flags = a.redFlags || [];
  return `
  <div class="analysis">
    <div class="analysis-top box">
      ${semafor(a.overall)}
      <div>
        <h4>${esc(a.headline)}</h4>
        <p style="margin:0">${esc(a.summary)}</p>
        <div class="small muted" style="margin-top:6px">Vyhodnoceno ${fmtDateTime(a.analyzedAt)} · AI návrh, finální slovo máš ty</div>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="box">
        <h4>Hodnoty 4BROS</h4>
        <ul class="verdict-list">
          ${values.map((v) => `
            <li>${light(v.status === "unknown" ? "" : v.status)}
              <div><b>${esc(v.name)}</b> <span class="small muted">· ${STATUS_LABEL[v.status] || ""}</span>
                <div class="small">${esc(v.comment)}</div>
                ${v.evidence ? `<q>${esc(v.evidence)}</q>` : ""}
              </div></li>`).join("")}
        </ul>
      </div>
      <div class="box ${flags.some((f) => f.severity === "red") ? "red" : ""}">
        <h4>Red flags</h4>
        ${flags.length ? `<ul class="verdict-list">
          ${flags.map((f) => `
            <li>${light(f.severity)}
              <div><b>${esc(f.name)}</b>
                <div class="small">${esc(f.comment)}</div>
                ${f.evidence ? `<q>${esc(f.evidence)}</q>` : ""}
              </div></li>`).join("")}
        </ul>` : `<p class="small" style="margin:0">Žádné varovné signály se v přepisu neobjevily. ✅</p>`}
      </div>
    </div>
    <div class="grid grid-2">
      ${a.strengths?.length ? `<div class="box"><h4>Co funguje</h4><ul>${a.strengths.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
      ${a.followUpQuestions?.length ? `<div class="box"><h4>Otázky na příště</h4><ul>${a.followUpQuestions.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
    </div>
    ${a.recommendation ? `<div class="box"><h4>Doporučený další krok</h4><p style="margin:0">${esc(a.recommendation)}</p></div>` : ""}
  </div>`;
}

function viewCalendar() {
  const today = todayIso();
  const base = state.calMonth || today.slice(0, 7);
  const [y, m] = base.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const offset = (first.getDay() + 6) % 7; // pondělí = 0
  const start = new Date(y, m - 1, 1 - offset);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(toIso(d));
  }
  if (days.slice(35).every((d) => !d.startsWith(base))) days.length = 35;
  ensureGcalWatch(days[0], addDays(days[days.length - 1], 1));

  const byDate = {};
  for (const mt of allMeetings()) (byDate[mt.date] ||= []).push({ type: "meeting", ...mt });
  for (const p of state.db.people.filter((x) => !x.archived)) (byDate[p.startDate] ||= []).push({ type: "start", person: p });
  const ownIds = new Set(state.db.people.flatMap((p) => Object.values(p.checkins || {}).map((ci) => ci.gcal?.eventId).filter(Boolean)));
  for (const ev of state.gcalEvents) if (!ownIds.has(ev.id)) (byDate[ev.date] ||= []).push({ type: "google", ...ev });

  const monthName = first.toLocaleDateString("cs-CZ", { month: "long", year: "numeric" });
  const dows = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];

  return `
    <div class="section-head">
      <h1 style="text-transform:capitalize">${monthName}</h1>
      <div class="row">
        <button class="btn secondary sm" data-action="cal-move" data-delta="-1" aria-label="Předchozí měsíc">←</button>
        <button class="btn secondary sm" data-action="cal-today">Dnes</button>
        ${state.mcp ? `<button class="btn sm" data-action="gcal-sync-all" ${state.gcalBusy ? "disabled" : ""}>${state.gcalBusy ? `<span class="spinner"></span> Zapisuju…` : "📅 Zapsat vše do Google Kalendáře"}</button>` : ""}
        <button class="btn secondary sm" data-action="cal-move" data-delta="1" aria-label="Další měsíc">→</button>
      </div>
    </div>
    <div class="row small muted" style="margin-bottom:12px">
      <span class="cal-ev start" style="display:inline-block">nástup</span>
      <span class="cal-ev" style="display:inline-block">naplánováno</span>
      <span class="cal-ev overdue" style="display:inline-block">po termínu</span>
      <span class="cal-ev green" style="display:inline-block">souzní</span>
      <span class="cal-ev orange" style="display:inline-block">pozor</span>
      <span class="cal-ev red" style="display:inline-block">red flag</span>
      ${state.mcp ? `<span class="cal-ev google" style="display:inline-block">tvůj Google Kalendář</span>` : ""}
    </div>
    ${gcalStatusBanner()}
    <div class="cal">
      ${dows.map((d) => `<div class="cal-dow">${d}</div>`).join("")}
      ${days.map((d) => `
        <div class="cal-day ${d.startsWith(base) ? "" : "other"} ${d === today ? "today" : ""}">
          <div class="cal-num">${parseIso(d).getDate()}</div>
          ${(byDate[d] || []).map((ev) => ev.type === "google"
            ? `<a class="cal-ev google" href="${esc(ev.link)}" target="_blank" rel="noopener" title="Google Kalendář: ${esc(ev.summary)}">${ev.time ? `${esc(ev.time)} ` : ""}${esc(ev.summary)}</a>`
            : ev.type === "start"
            ? `<a class="cal-ev start" href="#/clovek/${ev.person.id}" title="Nástup: ${esc(ev.person.name)}">🎉 ${esc(ev.person.name)}</a>`
            : `<a class="cal-ev ${ev.status || (!ev.done && ev.date < today ? "overdue" : "")}" href="#/clovek/${ev.person.id}" title="${esc(ev.person.name)} – ${esc(ev.cp.label)}">${esc(ev.person.name)} · ${esc(ev.cp.label)}</a>`,
          ).join("")}
        </div>`).join("")}
    </div>`;
}

        <div class="cp-list">

      </div>

}

function render() {
  const route = state.route;
  const param = state.routeParam;
  const hash = `${route}/${param || ""}`;
  const tab = route.startsWith("vyberko") ? "vyberko" : "feedback";
  const navRoute = route === "vyberko-pozice" || route === "vyberko-uchazec" ? "vyberko" : route;
  document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
  document.querySelectorAll("#nav a").forEach((a) => {
    a.hidden = a.dataset.tab !== tab;
    a.classList.toggle("active", a.dataset.route === navRoute || (route === "clovek" && a.dataset.route === "lide"));
  });
  $("#brand-sub").textContent = tab === "vyberko" ? "Výběrko · síto na CV" : "HR check-iny";
  const app = $("#app");
  app.onclick = null;
  const scroll = window.scrollY;
  const sameView = render._last === hash;
  const vbRoute = { vyberko: "pozice", "vyberko-pozice": "pozice", "vyberko-uchazec": "kandidat", "vyberko-nastaveni": "nastaveni" }[route];
  const views = { prehled: viewDashboard, lide: viewPeople, clovek: () => viewPerson(param), kalendar: viewCalendar, nastaveni: viewSettings };
  app.innerHTML = vbRoute ? Vyberko.view(vbRoute, param) : (views[route] || viewDashboard)();
  if (vbRoute) Vyberko.bind(vbRoute, param);
  if (sameView) window.scrollTo(0, scroll);
  else window.scrollTo(0, 0);
  render._last = hash;
}

function cleanTranscript(text, filename = "") {
  let t = text.replace(/\r\n?/g, "\n");
  if (/\.(vtt|srt)$/i.test(filename) || /^WEBVTT/.test(t)) {
    t = t
      .split("\n")
      .filter((line) => !/^WEBVTT/.test(line) && !/^\d+$/.test(line.trim()) && !/-->/.test(line) && !/^NOTE\b/.test(line))
      .join("\n")
      .replace(/<v\s+([^>]+)>/g, "$1: ")
      .replace(/<\/?[^>]+>/g, "")
      .replace(/\n{2,}/g, "\n");
  }
  return t.trim();
}

function setTranscript(personId, cpId, text) {
  const p = findPerson(personId);
  const ci = getCheckin(p, cpId);
  ci.transcript = text;
  ci.done = true;
  save();
  render();
  toast("Přepis uložen" + (state.aiReady ? " – teď klikni na „Vyhodnotit semafor“" : ""));
}

async function readFileAsTranscript(file, personId, cpId) {
  if (/\.(docx?|pdf)$/i.test(file.name)) {
    toast("Word/PDF zatím neumím – ulož přepis jako .txt nebo text vlož přes „Vložit text“.");
    return;
  }
  const text = cleanTranscript(await file.text(), file.name);
  if (!text) return toast("Soubor je prázdný.");
  setTranscript(personId, cpId, text);
}

function pickFile(accept, cb) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = accept;
  input.addEventListener("change", () => input.files[0] && cb(input.files[0]));
  input.click();
}

const ANALYSIS_INSTRUCTIONS = `Jsi zkušená HR partnerka ve firmě 4BROS (brněnská marketingová agentura). Pomáháš HR vyhodnocovat adaptační check-iny nováčků během prvních 3 měsíců (zkušební doby).

Dostaneš přepis rozhovoru HR s nováčkem, firemní hodnoty a seznam varovných signálů (red flags). Férově posuď, jak postoje a chování člověka souzní s kulturou 4BROS, a upozorni na rizika.

Pravidla:
- Opírej se jen o to, co v přepisu skutečně zaznělo. Ke každému hodnocení dej krátkou doslovnou citaci (evidence). Když k hodnotě nic nezaznělo, dej status "unknown" a evidence nech prázdnou.
- Semafor: "green" = jasně souzní, "orange" = nejasné / smíšené / stojí za doptání, "red" = jde proti hodnotě nebo je to vážný signál.
- Red flag uváděj jen tehdy, když ho přepis opravdu dokládá. Nevymýšlej. Rozlišuj běžnou nejistotu nováčka (normální v prvních týdnech) od skutečného varovného signálu.
- Hodnoť hlavně podle cíle, otázek a green/red flagů dané fáze. Zohledni fázi adaptace a zaměření daného check-inu.
- Nehodnoť osobnost ani citlivé charakteristiky (věk, zdraví, rodina, původ apod.) – jen pracovní postoje a chování.
- overall: "red", pokud je aspoň jeden vážný red flag; "orange", pokud jsou nejasnosti nebo menší signály; jinak "green".
- Piš česky, lidsky a přímo – tak, jak mluví 4BROS. Otázky na příště tykej.`;

function buildPrompt(p, cp, transcript) {
  const s = settings();
  return `${ANALYSIS_INSTRUCTIONS}

<kontext>
Jméno: ${p.name}
Pozice: ${p.role || "neuvedeno"}
Tým: ${p.team || "neuvedeno"}
Datum nástupu: ${p.startDate}
Check-in: ${cp.label} (${cp.window || `${cp.day}. den`} od nástupu)
Zaměření: ${cp.focus || "obecný adaptační rozhovor"}
Cíl této fáze: ${cp.goal || "neuveden"}
Otázky, které HR v této fázi klade:
${(cp.questions || []).map((q, i) => `${i + 1}. ${q}`).join("\n") || "neuvedeny"}
Green flag této fáze: ${cp.greenCriteria || "neuveden"}
Red flag této fáze: ${cp.redCriteria || "neuveden"}
</kontext>

<hodnoty_4bros>
${s.values.map((v) => `- ${v.name}: ${v.description}`).join("\n")}
</hodnoty_4bros>

<red_flags>
${s.redFlags.map((f) => `- ${f.name}: ${f.description}`).join("\n")}
</red_flags>

<prepis>
${transcript}
</prepis>

Odpověz POUZE jedním JSON objektem v tomto tvaru:
{
  "overall": "green" | "orange" | "red",
  "headline": "jedna krátká věta shrnutí",
  "summary": "3–5 vět",
  "values": [{"name": "přesný název hodnoty ze seznamu", "status": "green" | "orange" | "red" | "unknown", "evidence": "doslovná citace nebo prázdný řetězec", "comment": "krátký komentář"}],
  "redFlags": [{"name": "název signálu", "severity": "orange" | "red", "evidence": "doslovná citace", "comment": "krátký komentář"}],
  "strengths": ["…"],
  "followUpQuestions": ["3–5 otázek na příští check-in"],
  "recommendation": "konkrétní další krok pro HR / leadera"
}
V poli "values" uveď každou hodnotu ze seznamu právě jednou. V poli "redFlags" jen signály, které přepis dokládá (prázdné pole, pokud žádné).`;
}

const STATUSES = ["green", "orange", "red"];
function normalizeAnalysis(r) {
  if (!r || typeof r !== "object" || !STATUSES.includes(r.overall)) throw { code: "invalid_json" };
  const str = (x) => (typeof x === "string" ? x : "");
  const arr = (x) => (Array.isArray(x) ? x : []);
  return {
    overall: r.overall,
    headline: str(r.headline),
    summary: str(r.summary),
    values: arr(r.values).map((v) => ({
      name: str(v?.name),
      status: [...STATUSES, "unknown"].includes(v?.status) ? v.status : "unknown",
      evidence: str(v?.evidence),
      comment: str(v?.comment),
    })),
    redFlags: arr(r.redFlags).map((f) => ({
      name: str(f?.name),
      severity: f?.severity === "red" ? "red" : "orange",
      evidence: str(f?.evidence),
      comment: str(f?.comment),
    })),
    strengths: arr(r.strengths).map(str).filter(Boolean),
    followUpQuestions: arr(r.followUpQuestions).map(str).filter(Boolean),
    recommendation: str(r.recommendation),
    analyzedAt: new Date().toISOString(),
  };
}

const SAMPLE_ERRORS = {
  not_granted: "stránka nemá povolení používat Clauda.",
  sampling_disabled: "Claude není pro tenhle účet dostupný.",
  rate_limited: "teď je toho moc najednou, zkus to za chvíli.",
  session_expired: "přihlas se znovu na claude.ai.",
  prompt_too_large: "přepis je moc dlouhý – zkrať ho.",
  refused: "Claude tenhle přepis odmítl vyhodnotit.",
  invalid_json: "odpověď nešla přečíst, zkus to znovu.",
};

async function runAnalysis(personId, cpId) {
  const p = findPerson(personId);
  const cp = settings().checkpoints.find((c) => c.id === cpId);
  const ci = getCheckin(p, cpId);
  const key = `${personId}:${cpId}`;
  if (!state.sample || state.analyzing.has(key)) return;
  const ctl = new AbortController();
  state.analyzing.set(key, ctl);
  render();
  try {
    const raw = await state.sample.json(buildPrompt(p, cp, ci.transcript), {
      modelTier: "complex",
      cache: false,
      signal: ctl.signal,
    });
    const person = findPerson(personId);
    if (person) {
      getCheckin(person, cpId).analysis = normalizeAnalysis(raw);
      save();
      toast("Hotovo – semafor je vyhodnocený");
    }
  } catch (err) {
    if (err?.code === "not_granted" || err?.code === "sampling_disabled") state.aiReady = false;
    if (err?.code !== "cancelled") toast("Vyhodnocení se nepovedlo: " + (SAMPLE_ERRORS[err?.code] || "zkus to prosím znovu."));
  } finally {
    state.analyzing.delete(key);
    render();
  }
}

// ---------- Google Kalendář (přes konektor na claude.ai) ----------
const GCAL = "Google Calendar";

function durationMinutes(cp) {
  const nums = (cp.duration || "").match(/\d+/g);
  return nums ? Math.max(...nums.map(Number)) : 30;
}
function checkinTime(ci) {
  return ci?.time || settings().calendar?.defaultTime || "10:00";
}
function localDateTime(date, time, plusMinutes = 0) {
  const [h, m] = time.split(":").map(Number);
  const d = parseIso(date);
  d.setHours(h, m + plusMinutes, 0, 0);
  const pad = (n) => String(n).padStart(2, "0");
  return `${toIso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
}
function eventSpec(p, cp) {
  const ci = p.checkins?.[cp.id];
  const date = checkinDate(p, cp);
  const time = checkinTime(ci);
  return {
    summary: `HR check-in: ${p.name} – ${cp.label}`,
    startTime: localDateTime(date, time),
    endTime: localDateTime(date, time, durationMinutes(cp)),
    timeZone: "Europe/Prague",
    description: calendarText(p, cp).details,
    visibility: "private",
  };
}
const specKey = (spec) => JSON.stringify([spec.summary, spec.startTime, spec.endTime, spec.description]);

/** Najde id vytvořené události v odpovědi konektoru (bez spoléhání na přesný tvar). */
function findEventId(value, depth = 0) {
  if (!value || typeof value !== "object" || depth > 3) return null;
  for (const key of ["eventId", "id"]) if (typeof value[key] === "string" && value[key]) return value[key];
  for (const v of Object.values(value)) {
    const found = findEventId(v, depth + 1);
    if (found) return found;
  }
  return null;
}

const GCAL_ERRORS = {
  needs_reauth: "Google Kalendář je potřeba znovu připojit: claude.ai → Settings → Connectors.",
  server_not_connected: "Google Kalendář není připojený: claude.ai → Settings → Connectors.",
  selection_required: "Na claude.ai vyber, který Google Kalendář se má použít.",
  not_in_manifest: "Appka nemá povolený přístup ke Google Kalendáři. Povol ho, až se claude.ai zeptá.",
  blocked_by_policy: "Přístup ke Google Kalendáři blokuje nastavení organizace.",
  approval_required: "Zápis do kalendáře vyžaduje schválení správcem.",
  server_unavailable: "Google Kalendář teď neodpovídá. Zkontroluj kalendář a zkus to za chvíli znovu.",
  not_granted: "Propojení s kalendářem tu není dostupné.",
  capability_disabled: "Propojení s kalendářem tu není dostupné.",
};
function gcalErrorText(e) {
  if (e?.code === "no_event_id") return "Událost se v Google Kalendáři vytvořila, ale appka nezná její ID – napiš prosím Claudovi.";
  if (e?.code === "tool_error") return "Google Kalendář akci odmítl" + (e.message ? `: ${e.message}` : ".");
  return GCAL_ERRORS[e?.code] || "Zápis do Google Kalendáře se nepovedl. Zkontroluj kalendář a zkus to znovu.";
}

async function gcal(tool, input) {
  if (!state.mcp) throw { code: "not_granted" };
  const res = await state.mcp.callTool(GCAL, tool, input, { cache: false });
  return res?.payload ?? res;
}

function gcalStatusBanner() {
  if (!state.mcp) return `<div class="banner" style="margin-bottom:12px">Google Kalendář tu není propojený. Připoj ho na claude.ai v Settings → Connectors a stránku obnov.</div>`;
  if (state.gcalError) return `<div class="banner" style="margin-bottom:12px">${esc(state.gcalError)}</div>`;
  return "";
}

const GCAL_DENIALS = new Set(["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy", "approval_required", "selection_required"]);

/** Načítá (a průběžně obnovuje) tvoje Google události pro zobrazený rozsah. Odebírá jen při změně rozsahu. */
function ensureGcalWatch(from, to) {
  if (!state.mcp?.watchTool) return;
  const key = `${from}/${to}`;
  if (state.gcalWatch?.key === key) return;
  state.gcalWatch?.unsub();
  state.gcalEvents = [];
  const input = { startTime: `${from}T00:00:00`, endTime: `${to}T00:00:00`, timeZone: "Europe/Prague", orderBy: "startTime", pageSize: 250 };
  const unsub = state.mcp.watchTool(GCAL, "list_events", input, (ev) => {
    if (state.gcalWatch?.key !== key) return;
    if (ev.type === "data") {
      const list = ev.result?.payload?.events;
      state.gcalEvents = Array.isArray(list) ? list.map(toGcalEvent).filter(Boolean) : [];
      if (state.gcalError) state.gcalError = "";
    } else {
      if (GCAL_DENIALS.has(ev.error?.code)) state.gcalEvents = [];
      state.gcalError = gcalErrorText(ev.error);
    }
    if (state.route === "kalendar") renderSoon();
  }, { refetchInterval: 5 * 60 * 1000 });
  state.gcalWatch = { key, unsub };
}

function toGcalEvent(e) {
  if (!e || e.status === "cancelled") return null;
  const start = e.start?.dateTime || e.start?.date;
  if (!start) return null;
  return {
    id: e.id,
    summary: e.summary || "(bez názvu)",
    date: start.slice(0, 10),
    time: e.start?.dateTime ? start.slice(11, 16) : "",
    link: typeof e.htmlLink === "string" && e.htmlLink.startsWith("https://") ? e.htmlLink : "https://calendar.google.com/",
  };
}

/** Zapíše / aktualizuje check-iny člověka v Google Kalendáři. Vrací počty. */
async function syncPerson(p) {
  const out = { created: 0, updated: 0 };
  if (p.archived) return out;
  for (const cp of settings().checkpoints) {
    const ci = getCheckin(p, cp.id);
    if (isDone(ci) && !ci.gcal) continue; // proběhlé schůzky se nově nezapisují
    const spec = eventSpec(p, cp);
    const key = specKey(spec);
    if (ci.gcal?.eventId) {
      if (ci.gcal.key === key) continue;
      await gcal("update_event", { eventId: ci.gcal.eventId, ...spec, notificationLevel: "NONE" });
      ci.gcal = { ...ci.gcal, key };
      out.updated++;
    } else {
      const payload = await gcal("create_event", { ...spec, notificationLevel: "NONE" });
      const eventId = findEventId(payload);
      if (!eventId) throw { code: "no_event_id" };
      ci.gcal = { eventId, key };
      out.created++;
    }
    save();
  }
  return out;
}

const isSynced = (p) => Object.values(p.checkins || {}).some((ci) => ci.gcal?.eventId);
const autoSync = () => Boolean(state.mcp) && settings().calendar?.autoSync !== false;

async function runSync(people, { quiet = false } = {}) {
  if (!state.mcp || state.gcalBusy) return;
  state.gcalBusy = true;
  if (!quiet) render();
  let created = 0, updated = 0;
  try {
    for (const p of people) {
      const r = await syncPerson(p);
      created += r.created;
      updated += r.updated;
    }
    state.gcalError = "";
    state.mcp.invalidate?.(GCAL, "list_events").catch(() => {});
    if (!quiet || created || updated) {
      toast(created || updated
        ? `Google Kalendář: ${created ? `přidáno ${created}` : ""}${created && updated ? ", " : ""}${updated ? `upraveno ${updated}` : ""}`
        : "Google Kalendář je aktuální");
    }
  } catch (e) {
    state.gcalError = gcalErrorText(e);
    toast(state.gcalError);
  } finally {
    state.gcalBusy = false;
    save();
    render();
  }
}

async function deleteEventsOf(p) {
  if (!state.mcp) return;
  for (const ci of Object.values(p.checkins || {})) {
    if (!ci.gcal?.eventId) continue;
    try {
      await gcal("delete_event", { eventId: ci.gcal.eventId, notificationLevel: "NONE" });
    } catch (e) {
      toast("Událost v Google Kalendáři se nepodařilo smazat – smaž ji prosím ručně.");
    }
  }
}

function calendarText(p, cp) {
  return {
    title: `HR check-in: ${p.name} – ${cp.label}`,
    details: [cp.duration && `Délka: ${cp.duration}`, cp.goal && `Cíl: ${cp.goal}`, (cp.questions || []).length && `Otázky:\n${cp.questions.map((q) => `• ${q}`).join("\n")}`, "Po schůzce nahraj přepis do HR check-inů."].filter(Boolean).join("\n\n"),
  };
}
function gcalLink(p, cp, date) {
  const { title, details } = calendarText(p, cp);
  const d = date.replace(/-/g, "");
  const next = addDays(date, 1).replace(/-/g, "");
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: title, dates: `${d}/${next}`, details });
}
function outlookLink(p, cp, date) {
  const { title, details } = calendarText(p, cp);
  return "https://outlook.office.com/calendar/0/deeplink/compose?" + new URLSearchParams({
    subject: title, body: details, startdt: date, enddt: addDays(date, 1), allday: "true", path: "/calendar/action/compose", rru: "addevent",
  });
}

function bindEvents() {
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute("href"));
  });

  $("#modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  });

  document.addEventListener("click", async (e) => {
    const row = e.target.closest("tr[data-href]");
    if (row && !e.target.closest("a, button")) {
      go(row.dataset.href);
      return;
    }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const { action, id, cp } = el.dataset;
    const p = id ? findPerson(id) : null;

    switch (action) {
      case "close-modal": closeModal(); break;
      case "add-person": openPersonForm(); break;
      case "edit-person": openPersonForm(p); break;
      case "archive-person":
        p.archived = !p.archived; save(); render();
        toast(p.archived ? "Archivováno – zmizí z přehledu a kalendáře" : "Vráceno z archivu");
        break;
      case "gcal-sync": runSync([p]); break;
      case "gcal-sync-all": runSync(state.db.people.filter((x) => !x.archived)); break;
      case "delete-person":
        if (await ask(`Smazat ${p.name} včetně všech přepisů a poznámek${isSynced(p) ? " a schůzek v Google Kalendáři" : ""}? Nejde to vrátit.`, { ok: "Smazat", danger: true })) {
          state.analyzing.forEach((ctl, k) => k.startsWith(id + ":") && ctl.abort());
          await deleteEventsOf(p);
          state.db.people = state.db.people.filter((x) => x.id !== id);
          save(); go("#/lide"); toast("Smazáno");
        }
        break;
      case "toggle-archived":
        state.showArchived = el.checked; render(); break;
        break;
      case "upload":
        pickFile(".txt,.md,.vtt,.srt,text/plain", (f) => readFileAsTranscript(f, id, cp));
        break;
      case "paste":
        openModal(`
          <h2>Vložit přepis</h2>
          <form id="paste-form" class="stack">
            <textarea name="text" style="min-height:260px" placeholder="Sem vlož text přepisu schůzky…" required></textarea>
            <div class="row between"><button type="button" class="btn secondary" data-action="close-modal">Zrušit</button><button class="btn">Uložit přepis</button></div>
          </form>`, (root) => {
          $("#paste-form", root).addEventListener("submit", (ev) => {
            ev.preventDefault();
            const text = cleanTranscript(new FormData(ev.target).get("text"));
            closeModal();
            if (text) setTranscript(id, cp, text);
          });
        });
        break;
      case "mark-done":
        getCheckin(p, cp).done = true; save(); render(); break;
      case "remove-transcript":
        if (await ask("Smazat přepis i jeho vyhodnocení?", { ok: "Smazat", danger: true })) {
          Object.assign(getCheckin(p, cp), { transcript: "", analysis: null }); save(); render();
        }
        break;
      case "analyze": runAnalysis(id, cp); break;
      case "stop-analyze": state.analyzing.get(`${id}:${cp}`)?.abort(); break;
      case "delete-note":
        p.notes = p.notes.filter((n) => n.id !== el.dataset.note); save(); render(); break;
      case "cal-move": {
        const [y, m] = (state.calMonth || todayIso().slice(0, 7)).split("-").map(Number);
        const d = new Date(y, m - 1 + Number(el.dataset.delta), 1);
        state.calMonth = toIso(d).slice(0, 7); render(); break;
      }
      case "cal-today": state.calMonth = null; render(); break;
      case "add-item": {
        const kind = el.dataset.kind;
        if (kind === "checkpoints") settings().checkpoints.push({ id: "c-" + uid(), day: 45, label: "Nový check-in", window: "", duration: "", focus: "", goal: "", questions: [], greenCriteria: "", redCriteria: "" });
        else settings()[kind].push({ id: uid(), name: "", description: "" });
        sortCheckpoints(); save(); render(); break;
      }
      case "remove-item": {
        const list = settings()[el.dataset.kind];
        const item = list[Number(el.dataset.i)];
        if (await ask(`Odebrat „${item.name || item.label || "položku"}“?`, { ok: "Odebrat", danger: true })) {
          list.splice(Number(el.dataset.i), 1); save(); render();
        }
        break;
      }
      case "reset-settings":
        if (await ask("Vrátit hodnoty a red flags na výchozí? Check-iny zůstanou.", { ok: "Obnovit" })) {
          settings().values = structuredClone(DEFAULT_SETTINGS.values);
          settings().redFlags = structuredClone(DEFAULT_SETTINGS.redFlags);
          save(); render();
        }
        break;
      case "export-json":
        download(`fourbros-hr-zaloha-${todayIso()}.json`, JSON.stringify(state.db, null, 2));
        break;
      case "import-json":
        pickFile(".json,application/json", async (f) => {
          try {
            const db = JSON.parse(await f.text());
            if (!Array.isArray(db.people) || !db.settings) throw new Error("neplatný formát");
            if (!(await ask("Nahrát zálohu? Současná data se přepíšou.", { ok: "Nahrát", danger: true }))) return;
            state.db = db; save(); render(); toast("Záloha nahrána");
          } catch (err) {
            toast("Zálohu se nepodařilo načíst: " + err.message);
          }
        });
        break;
      case "wipe":
        if (await ask("Smazat VŠECHNA data (lidi, přepisy, poznámky a jejich schůzky v Google Kalendáři)? Nejdřív si stáhni zálohu.", { ok: "Smazat vše", danger: true, typeToConfirm: "SMAZAT" })) {
          state.analyzing.forEach((ctl) => ctl.abort());
          for (const person of state.db.people) await deleteEventsOf(person);
          state.db = emptyDb(); save(); go("#/prehled"); toast("Data smazána");
        }
        break;
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.change) {
      const p = findPerson(el.dataset.id);
      const ci = getCheckin(p, el.dataset.cp);
      if (el.dataset.change === "ci-date") ci.date = el.value || null;
      if (el.dataset.change === "ci-time") ci.time = el.value || null;
      if ((el.dataset.change === "ci-date" || el.dataset.change === "ci-time") && (ci.gcal?.eventId || autoSync())) {
        save(); render(); runSync([p], { quiet: true }); return;
      }
      if (el.dataset.change === "ci-manual") ci.manualStatus = el.value || null;
      if (el.dataset.change === "ci-notes") { ci.notes = el.value; save(); toast("Poznámka uložena"); return; }
      save(); render();
      return;
    }
    if (el.dataset.setting) {
      const value = el.type === "checkbox" ? el.checked : el.value || "10:00";
      settings().calendar = { ...(settings().calendar || {}), [el.dataset.setting]: value };
      save();
      toast(el.type === "checkbox" ? (value ? "Automatický zápis zapnutý" : "Automatický zápis vypnutý") : "Uloženo – platí pro schůzky bez vlastního času");
      return;
    }
    if (el.dataset.edit) {
      const item = settings()[el.dataset.edit][Number(el.dataset.i)];
      const k = el.dataset.key;
      item[k] = k === "day" ? Math.max(1, Number(el.value) || 1)
        : k === "questions" ? el.value.split("\n").map((q) => q.trim()).filter(Boolean)
        : el.value;
      if (el.dataset.edit === "checkpoints" && el.dataset.key === "day") { sortCheckpoints(); render(); }
      save();
    }
  });

  document.addEventListener("submit", (e) => {
    const form = e.target;
    if (form.dataset.form === "add-note") {
      e.preventDefault();
      const text = new FormData(form).get("text").trim();
      if (!text) return;
      const p = findPerson(form.dataset.id);
      (p.notes ||= []).push({ id: uid(), createdAt: new Date().toISOString(), text });
      save(); render(); toast("Poznámka přidána");
    }
  });

  // drag & drop přepisů
  document.addEventListener("dragover", (e) => {
    const dz = e.target.closest("[data-drop]");
    if (dz) { e.preventDefault(); dz.classList.add("over"); }
  });
  document.addEventListener("dragleave", (e) => e.target.closest?.("[data-drop]")?.classList.remove("over"));
  document.addEventListener("drop", (e) => {
    const dz = e.target.closest("[data-drop]");
    if (!dz) return;
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) readFileAsTranscript(file, dz.dataset.id, dz.dataset.cp);
  });
}

function sortCheckpoints() {
  settings().checkpoints.sort((a, b) => a.day - b.day);
}

// ---------- start ----------

(async function init() {
  bindEvents();
  try {
    await load();
    render();
  } catch (err) {
    state.db ||= emptyDb();
    state.storeState = "none";
    render();
    toast("Data se nepodařilo načíst – zkus stránku obnovit.");
  }
})();

</script>

</body></html>
